// Managerupdate: uitkomsten en bewijs eerst, activiteit apart, dan risico's, besluiten, hulp en volgende stap.
function managerUpdate(c){
  if(!c.ws)return weekUpdateText(c);
  const S=weekSummary(c.ws,c.date),L=[`Weekupdate week ${isoWeek(c.ws)} (${fmt(c.ws)} – ${fmt(c.date)})`,''];
  if(c.notes?._all)L.push(c.notes._all,'');
  const krs=(c.weekKrs||[]).map(id=>krById(id)).filter(Boolean);
  L.push('Resultaten (aangetoond)');
  if(!krs.length)L.push('- Geen weekresultaten gekozen.');
  for(const r of krs){const mv=krMovedWeek(r.k,c.ws,c.date),it=c.items.find(x=>x.krId===r.k.id),st=it?STATE[it.confidence]:STATE[krState(r.k)];
    const ev=[...mv.measures.map(m=>`stand ${m.value} ${r.k.unit}`),...mv.criteria.map(e=>`criterium: ${e.title}`),...mv.proofs.filter(p=>p.type!=='meting').map(p=>`${PROOF_SHORT[p.type].toLowerCase()}: ${p.text}`)];
    L.push(`- ${r.o.name} · ${krN(r)} — ${st}`);L.push(ev.length?ev.map(x=>'  · '+x).join('\n'):'  · nog geen aantoonbaar bewijs deze week')}
  const other=S.proofs.filter(x=>!krs.some(r=>r.k.id===x.k.id));if(other.length){L.push('','Ander bewijs');other.forEach(x=>L.push(`- ${x.o.name} · ${krN(x)}: ${x.p.text}`))}
  L.push('','Activiteit (uitvoering, geen resultaat)');
  const byO={};S.done.forEach(t=>{const n=obj(t.objectiveId)?.name||'Overig';(byO[n]=byO[n]||[]).push(t.title+(t.owner?` (door ${ownerName(t)})`:''))});
  if(!S.done.length)L.push('- Geen acties afgerond.');for(const[n,l]of Object.entries(byO))L.push(`- ${n}: ${plural(l.length,'actie','acties')} afgerond (${l.slice(0,4).join('; ')}${l.length>4?'; …':''})`);
  const bt=balanceText(c.ws,c.date);if(bt)L.push('- '+bt);
  const risks=[...c.items.filter(x=>['risk','blocked'].includes(x.confidence)).map(x=>{const r=krById(x.krId);return r?`- ${r.o.name} · ${krN(r)}: ${STATE[x.confidence].toLowerCase()}${x.obstacle?' — '+x.obstacle:''}${x.plan?' (aanpak: '+x.plan+')':''}`:null}).filter(Boolean),...S.blocked.map(t=>`- Wacht: ${t.title}${t.blocker?' — '+t.blocker:''}`)];
  if(risks.length){L.push('','Risico’s en blokkades');L.push(...risks)}
  if(S.decisions.length){L.push('','Besluiten');S.decisions.forEach(x=>L.push('- '+x.p.text))}
  if(c.help){L.push('','Hulp of besluit nodig');L.push('- '+c.help)}
  const nxt=[c.next,S.openC.length?`${plural(S.openC.length,'open toezegging','open toezeggingen')} gaan mee in de volgende weekplanning`:''].filter(Boolean);
  if(nxt.length){L.push('','Volgende week');nxt.forEach(x=>L.push('- '+x))}
  if(c.learned){L.push('','Geleerd');L.push('- '+c.learned)}
  return L.join('\n').trim();
}

const validTime=t=>/^([01]\d|2[0-3]):[0-5]\d$/.test(t||'');
function moments(){const r=db.settings.rhythm,out=[];
  if(r.planning.on)out.push({kind:'planning',n:0,...r.planning});

function buildIcs(){

  const ev=ms.flatMap(m=>{const M=MOMENT[m.kind],d=new Date();d.setHours(12,0,0,0);while(d.getDay()!==Number(m.day))d.setDate(d.getDate()+1);

  m[f]=v;if(kind==='checkin'){db.settings.checkinDay=r.checkin.day;db.settings.checkinTime=r.checkin.time}save();render()});
// Deeplink #/nu: open Vandaag en start (na bevestiging via de knop) de focus op de eerste actie.
window.addEventListener('hashchange',()=>{if(route.focusNow)setTimeout(()=>{const n=nextAction2()||suggestToday(1)[0];if(n)startFocus(n.t.id)},50)});

/* ---- 80-ai.js ---- */
/* ================= Release 6 · AI-ondersteuning ================= */
// Twee lagen. 1) Lokale, uitlegbare aanbevelingen die altijd werken. 2) Optioneel een taalmodel via /api/ai (Netlify-functie);
// valt dat weg, dan kopieer je een briefing naar Claude of ChatGPT. AI wijzigt nooit zelf objectives, KR's of bewijs.

// Weekplanning: welke KR's verdienen aandacht, en waarom.
function planRecs(){
  const t=iso(),prev=db.weeks.find(w=>w.id===addDays(weekStart(),-7)),out={},list=[];
  for(const o of objs())o.krs.forEach((k,idx)=>{if(achieved(k))return;let s=0;const why=[];
    if(k.confidence==='blocked'){s+=3;why.push('geblokkeerd')}else if(k.confidence==='risk'){s+=2.5;why.push('aandacht nodig')}
    if(k.due&&k.due<=addDays(t,28)){s+=k.due<=addDays(t,14)?3:1.5;why.push('streefdatum '+fmt(k.due))}
    const last=[...k.proofs.map(p=>p.date),...k.measures.map(m=>m.date),...k.evidence.filter(e=>e.doneAt).map(e=>e.doneAt)].sort().at(-1);
    if(!last){s+=1;why.push('nog geen bewijs')}else if(dayDiff(t,last)>=14){s+=1.5;why.push('al '+dayDiff(t,last)+' dagen geen bewijs')}
    if(prev?.krs.includes(k.id)&&!krHasMoved(k,prev.id,addDays(prev.id,6))){s+=1.5;why.push('vorige week gekozen, nog geen bewijs')}
    if(!open().some(x=>x.krId===k.id)){s-=.5;why.push('nog geen acties')}
    if(k.dependsOn.some(id=>{const d=krById(id);return d&&!achieved(d.k)})){s-=1.5;why.push('wacht op ander KR')}
    const b=(db.settings.week&&weekTargets()[bucketOf(o.id)])||0;if(b>=40)s+=.5;
    out[k.id]={score:s,reasons:why};list.push({id:k.id,s})});
  list.sort((a,b)=>b.s-a.s).slice(0,3).forEach(x=>{if(x.s>0)out[x.id].top=true});
  return out;
}
// Prioritering: realistische belasting, te veel tegelijk, verwaarloosde objectives.
function overcommit(ws=weekStart()){
  const c=open().filter(x=>x.week===ws),days=weekDays(ws).filter(d=>d>=iso()).length||1,per=c.length/days,doing=open().filter(x=>x.status==='doing').length;
  const msgs=[];
  if(c.length>days*3)msgs.push(`${c.length} acties voor ${plural(days,'werkdag','werkdagen')} is veel (${per.toFixed(1)} per dag). Wat kan naar de backlog?`);
  if(doing>2)msgs.push(`${doing} acties staan op bezig. Maak er eerst een af.`);
  const dup=new Map();c.filter(x=>x.planDay).forEach(x=>dup.set(x.planDay,(dup.get(x.planDay)||0)+1));for(const[d,n]of dup)if(n>4)msgs.push(`${dayLabel(d)} heeft ${n} geplande acties.`);
  return msgs.join(' ');
}
function neglected(){const t=iso();return objs().filter(o=>{const l=lastActivity(o.id);return o.krs.some(k=>!achieved(k))&&(!l||dayDiff(t,l)>=14)}).map(o=>{const l=lastActivity(o.id);o._why=l?`Sinds ${rel(l)} geen voortgang vastgelegd.`:'Nog geen voortgang vastgelegd.';return o})}
// Bewijs: werk gedaan, maar geen aantoonbare verandering.
function evidenceGaps(){const t=iso(),from=addDays(t,-21),out=[];
  for(const o of objs())o.krs.forEach((k,idx)=>{if(achieved(k))return;const d=db.tasks.filter(x=>x.krId===k.id&&x.done&&x.doneAt>=from).length;if(d>=2&&!krHasMoved(k,from,t))out.push({o,k,i:idx+1,n:d,text:`${d} acties afgerond in drie weken, maar geen nieuw bewijs, meting of criterium voor ${krName(k)}. Wat laat zien dat het werkt?`})});
  return out}
// Reflectie: terugkerende blokkades en patronen.
function patterns(){const out=[],from=addDays(iso(),-42);
  const cnt={};db.checkins.filter(c=>c.date>=from).forEach(c=>c.items.forEach(x=>{if(['risk','blocked'].includes(x.confidence))cnt[x.krId]=(cnt[x.krId]||0)+1}));
  for(const[id,n]of Object.entries(cnt))if(n>=2){const r=krById(id);if(r)out.push({title:`${krN(r)} ${r.o.name} staat al ${n} check-ins op risico`,why:'Terugkerend obstakel. Is de aanpak of het KR zelf aan herziening toe?'})}
  const words={};[...open().filter(t=>t.waiting).map(t=>t.blocker),...db.days.filter(d=>d.date>=from).map(d=>d.blocked)].filter(Boolean).forEach(s=>norm(s).split(/[^a-z]+/).filter(w=>w.length>4).forEach(w=>words[w]=(words[w]||0)+1));
  const top=Object.entries(words).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]).slice(0,3);if(top.length)out.push({title:'Terugkerend in je blokkades: '+top.map(x=>x[0]).join(', '),why:'Eén gesprek of besluit kan meerdere acties losmaken.'});
  const planned=db.weeks.filter(w=>w.id<weekStart()).slice(0,4),rate=planned.map(w=>{const ids=new Set(w.committed||[]),all=db.tasks.filter(t=>ids.has(t.id));return all.length?all.filter(t=>t.done).length/all.length:null}).filter(x=>x!=null);
  if(rate.length>=2){const avg=rate.reduce((a,b)=>a+b,0)/rate.length;if(avg<.5)out.push({title:`Je maakt gemiddeld ${Math.round(avg*100)}% van je weektoezeggingen af`,why:'Zeg minder toe; dan blijft er ruimte voor wat onverwacht komt.'})}
  return out}
function weekRecs(ws,to){const out=[];
  evidenceGaps().slice(0,2).forEach(g=>out.push({title:`Bewijs ontbreekt bij ${g.o.name} ${krN(g)}`,why:g.text}));
  const oc=open().filter(t=>t.week===ws);if(oc.length)out.push({title:`${plural(oc.length,'toezegging','toezeggingen')} nog open`,why:'Kies in je volgende weekplanning: meenemen, backlog of loslaten.'});
  neglected().slice(0,2).forEach(o=>out.push({title:`${o.name} ligt stil`,why:o._why+' Bewust, of verdient het volgende week een resultaat?'}));
  patterns().slice(0,2).forEach(p=>out.push(p));
  return out}
// Actie concreet maken: herkent vage formuleringen.
const VAGUE=/^(nadenken|kijken|iets|bezig|oppakken|uitzoeken|werken aan|focus op|verder met|regelen|afstemmen)\b/i;
const vagueActions=()=>open().filter(t=>t.objectiveId&&(VAGUE.test(t.title)||t.title.trim().split(/\s+/).length<3)).slice(0,6);

/* ----- assistent-venster met beslismomenten ----- */
const ASSIST={
  plan:{t:'Weekplanning',q:'Welke 2 of 3 Key Results verdienen deze week mijn aandacht, en waarom? Wat laat ik bewust liggen?',fmt:'Geef maximaal drie KR-keuzes met kr_id en één zin waarom. Stel acties voor als regels: - [kr_id] actie.'},
  action:{t:'Actie concreet maken',q:'Maak deze vage acties concreet en uitvoerbaar: zichtbaar resultaat, eerste stap, wie of wat nodig is.',fmt:'Geef per actie één verbeterde versie als regel: - [kr_id] concrete actie.'},
  prio:{t:'Prioriteiten',q:'Waar zitten conflicten, onrealistische belasting of verwaarloosde prioriteiten in mijn week?',fmt:'Maximaal drie punten. Stel eventueel acties voor als - [kr_id] actie.'},
  gaps:{t:'Bewijs-gaten',q:'Waar zie je werk zonder aangetoond resultaat? Welk bewijs zou overtuigen, en hoe krijg ik dat?',fmt:'Per KR: welk bewijs ontbreekt en één actie om het te krijgen: - [kr_id] actie. Verzin geen bewijs dat er niet is.'},
  checkin:{t:'Check-in concept',q:'Schrijf een beknopte managerupdate voor deze week. Scheid aangetoonde resultaten van activiteit; benoem risico’s, besluiten en hulp nodig.',fmt:'Gewone tekst, maximaal 200 woorden, in het Nederlands. Gebruik alleen feiten uit de context.'},
  reflect:{t:'Reflectie',q:'Welke patronen zie je in mijn blokkades, check-ins en uitvoering? Wat zou ik anders moeten doen?',fmt:'Maximaal drie inzichten met één concrete aanpassing elk.'},
};
let assistV='plan',assistOut='',assistBusy=false,aiAvail=null;
function localInsights(v){
  if(v==='plan'){const r=planRecs();return Object.entries(r).filter(([,x])=>x.top).map(([id,x])=>{const k=krById(id);return{title:`${k.o.name} · ${krN(k)} ${k.k.title}`,why:x.reasons.join(' · ')}})}
  if(v==='action')return vagueActions().map(t=>({title:t.title,why:'Te vaag om meteen te starten. Wat is het zichtbare resultaat, en wat is de eerste stap?',task:t.id}));
  if(v==='prio'){const out=[];const oc=overcommit();if(oc)out.push({title:'Belasting deze week',why:oc});neglected().forEach(o=>out.push({title:o.name+' krijgt geen aandacht',why:o._why}));const ws=weekStart(),lo=leftovers();if(lo.length)out.push({title:`${plural(lo.length,'oude toezegging','oude toezeggingen')}`,why:'Nog niet afgehandeld uit eerdere weken.'});return out}
  if(v==='gaps')return evidenceGaps().map(g=>({title:`${g.o.name} · ${krN(g)}`,why:g.text,kr:g.k.id}));
  if(v==='checkin'){const S=weekSummary();return[{title:`${S.done.length} acties af, ${S.proofs.length+S.criteria.length+S.measures.length} tekenen van voortgang`,why:'Je check-in maakt hier automatisch een managerupdate van.'}]}
  if(v==='reflect')return patterns();
  return[];
}
function assistPrompt(v){const A=ASSIST[v];ai.q=A.q;ai.scope='';
  const extra=v==='checkin'?'\n\nWeekoverzicht (automatisch):\n'+(()=>{const c={ws:weekStart(),date:iso(),weekKrs:weekKRs(),items:[],notes:{}};return managerUpdate(c)})():v==='action'?'\n\nVage acties:\n'+vagueActions().map(t=>`- [${t.krId||''}] ${t.title}`).join('\n'):'';
  return briefing().replace(/Mijn vraag: .*\n/,`Mijn vraag: ${A.q}\nAntwoordformaat: ${A.fmt}\n`)+extra}
function assistSheet(v=assistV){assistV=v;assistOut='';const L=localInsights(v);
  openLayer('assist',head(`${I('spark')} AI-assistent`)+`<div class="sheet-body">
   <div class="seg assist-tabs" role="tablist" aria-label="Beslismoment">${Object.entries(ASSIST).map(([k,a])=>`<button role="tab" data-a="assist" data-v="${k}" aria-selected="${k===v}" aria-pressed="${k===v}">${a.t}</button>`).join('')}</div>
   <section><div class="lbl-s">Wat Focus zelf ziet</div>${L.length?`<ul class="ins">${L.map(x=>`<li><b>${esc(x.title)}</b><span class="small">${esc(x.why)}</span>${x.task?`<button class="link" data-a="open-task" data-id="${x.task}">Bewerk</button>`:''}${x.kr?`<button class="link" data-a="proof" data-id="${x.kr}">Bewijs vastleggen</button>`:''}</li>`).join('')}</ul>`:'<p class="small">Niets opvallends. Goed bezig.</p>'}</section>
   <section><div class="lbl-s">Vraag een taalmodel om mee te denken</div><p class="small" style="margin:0">${ASSIST[v].q}</p>
    <div class="row"><button class="btn primary" data-a="assist-run" ${assistBusy?'disabled':''}>${assistBusy?'Bezig…':'Vraag AI'}</button><button class="btn" data-a="assist-copy">Kopieer briefing</button><span class="small" id="aiState">${aiAvail===false?'Geen AI-koppeling: gebruik de briefing.':''}</span></div>
    <div id="assistOut"></div></section>
   <p class="note" style="margin:0">Voorstellen zijn optioneel en zie je eerst. AI verandert nooit zelf je objectives, Key Results of bewijs.</p></div>`,{label:'AI-assistent'})}
async function callAI(prompt){
  const ep=db.settings.ai?.endpoint;if(ep==='off')throw new Error('uit');
  const url=ep&&ep!=='auto'?ep:'/api/ai';if(!/^https?:/.test(location.protocol)&&!/^https?:/.test(url))throw new Error('lokaal');
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),45000);
  try{const r=await fetch(url,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json',...(sess?.access_token?{Authorization:'Bearer '+sess.access_token}:{})},body:JSON.stringify({prompt})});
    if(r.status===404||r.status===405){aiAvail=false;throw new Error('geen koppeling')}
    if(r.status===401)throw new Error('log eerst in via Gegevens en back-up');if(r.status===503)throw new Error('AI is nog niet ingesteld op de server');if(!r.ok)throw new Error('fout '+r.status);const j=await r.json();if(!j.text)throw new Error('leeg antwoord');aiAvail=true;return j.text}
  finally{clearTimeout(to)}
}
function showAssistOut(txt){const ps=parseProposals(txt);ai.proposals=ps;
  $('#assistOut').innerHTML=`<div class="field"><label for="assistTxt">Antwoord <span class="small">bewerkbaar</span></label><textarea class="textarea" id="assistTxt" rows="8">${esc(txt)}</textarea></div>
   <div class="row">${ps.length?`<button class="btn" data-a="assist-props">Bekijk ${plural(ps.length,'voorgestelde actie','voorgestelde acties')}</button>`:''}${assistV==='checkin'?'<button class="btn" data-a="assist-use">Gebruik in managerupdate</button>':''}<button class="btn ghost" data-a="assist-copyout">Kopieer</button></div>
   <div id="aiReviewWrap" hidden><div id="aiReview"></div></div>`}
Object.assign(ACT,{
  assist:(b)=>assistSheet(b.dataset.v||assistV),
  ai:(b)=>assistSheet(route.view==='week'?'plan':route.view==='checkin'?'checkin':'plan'),
  'assist-run':async()=>{assistBusy=true;const btn=$('[data-a=assist-run]');if(btn){btn.disabled=true;btn.textContent='Bezig…'}
    try{const txt=await callAI(assistPrompt(assistV));assistBusy=false;if(btn){btn.disabled=false;btn.textContent='Vraag AI'}showAssistOut(txt)}
    catch(e){assistBusy=false;if(btn){btn.disabled=false;btn.textContent='Vraag AI'}const s=$('#aiState');if(s)s.textContent='AI is nu niet bereikbaar ('+e.message+'). Kopieer de briefing en plak het antwoord hieronder.';
      $('#assistOut').innerHTML=`<div class="field"><label for="assistPaste">Plak het antwoord van Claude of ChatGPT</label><textarea class="textarea" id="assistPaste" rows="5"></textarea><div class="row"><span class="spacer"></span><button class="btn" data-a="assist-paste">Verwerk</button></div></div>`}},
  'assist-copy':()=>copyText(assistPrompt(assistV),'Briefing gekopieerd. Plak hem in Claude of ChatGPT.'),
  'assist-paste':()=>showAssistOut($('#assistPaste').value||''),
  'assist-props':()=>{renderProposals();$('#aiReviewWrap').hidden=false},
  'assist-copyout':()=>copyText($('#assistTxt').value,'Gekopieerd'),
  'assist-use':()=>{const c=db.checkins[0],txt=$('#assistTxt').value;if(c&&c.ws===weekStart()){c.managerText=txt;save();closeLayer(true);render();toast('Concept in je managerupdate gezet. Controleer de feiten.')}else{copyText(txt,'Doe eerst je check-in; het concept staat op je klembord.')}},
});
function aiSettings(){const ep=db.settings.ai?.endpoint||'auto';return `<div class="field"><span class="lbl">AI-koppeling</span><div class="small">Standaard probeert Focus de eigen AI-functie (/api/ai). Werkt die niet, dan gebruik je de briefing. Zonder AI werkt alles gewoon.</div><select class="select" id="aiEp" aria-label="AI-koppeling"><option value="auto" ${ep==='auto'?'selected':''}>Automatisch (eigen AI-functie)</option><option value="off" ${ep==='off'?'selected':''}>Uit: alleen briefing kopiëren</option></select></div>`}
document.addEventListener('change',e=>{if(e.target.id==='aiEp'){db.settings.ai={...db.settings.ai,endpoint:e.target.value};aiAvail=null;save();toast('AI-koppeling bijgewerkt')}});

/* ---- 90-resilience.js ---- */
/* ================= Release 7 · herstelpunten, conflicten, offline ================= */
// Nooit stilletjes data kwijt: voor elke migratie, import, herstel of syncconflict bewaart Focus een kopie in deze browser.
const RP_LABEL={'voor-v8':'Vóór versie 8','voor-v2':'Vóór Focus 2.0','voor-waarde-update':'Vóór update Waardegedreven'};
function backupNow(tag){try{localStorage.setItem(KEY+':'+tag+'-'+Date.now(),JSON.stringify(db));pruneBackups()}catch{}}
function restorePoints(){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(KEY+':')){const tag=k.slice(KEY.length+1),m=tag.match(/^(.*)-(\d{13})$/);out.push({k,label:m?({conflict:'Versie van ander apparaat (conflict)',import:'Vóór import',herstel:'Vóór herstel'}[m[1]]||m[1]):(RP_LABEL[tag]||tag),ts:m?Number(m[2]):0})}}}catch{}return out.sort((a,b)=>b.ts-a.ts)}
function pruneBackups(){const l=restorePoints().filter(x=>x.ts);l.slice(8).forEach(x=>{try{localStorage.removeItem(x.k)}catch{}})}
function restoreBlock(){const l=restorePoints();if(!l.length)return '';
  return `<details class="field"><summary class="lbl">Herstelpunten <span class="small">${l.length}</span></summary><div class="small">Kopieën die Focus automatisch bewaarde. Herstellen bewaart eerst je huidige stand.</div>${l.map(x=>`<div class="row"><span class="small">${esc(x.label)}${x.ts?' · '+new Date(x.ts).toLocaleString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''}</span><span class="spacer"></span><button class="link" data-a="rp-dl" data-k="${esc(x.k)}">Download</button><button class="link" data-a="rp-restore" data-k="${esc(x.k)}">Herstel</button></div>`).join('')}</details>`}
Object.assign(ACT,{
  'rp-dl':(b)=>{const raw=rd(b.dataset.k);if(raw)downloadText('focus-herstelpunt.json',raw,'application/json')},
  'rp-restore':(b)=>{const raw=rd(b.dataset.k);let d;try{d=JSON.parse(raw)}catch{toast('Dit herstelpunt is beschadigd.');return}if(!d||!Array.isArray(d.objectives)){toast('Dit herstelpunt is geen Focus-back-up.');return}
    if(!confirm('Je huidige gegevens vervangen door dit herstelpunt? Je huidige stand wordt eerst bewaard.'))return;
    backupNow('herstel');db=d;normalize();applyContentUpdates();save();closeLayer(true);go('/');render();toast('Herstelpunt teruggezet')},
});
// Offline: Focus werkt gewoon door; synchronisatie volgt zodra er weer verbinding is.
window.addEventListener('offline',()=>{refreshSyncUI();toast('Je bent offline. Focus werkt door en synchroniseert later.')});
window.addEventListener('online',()=>refreshSyncUI());

/* boot */
captureAuthHash();sessInit();load();save();route=parseHash();render();startSync();if(pinLocked())showLock();if(contentNotice)toast(contentNotice);
if(route.focusNow&&!pinLocked())setTimeout(()=>{const n=nextAction2()||suggestToday(1)[0];if(n)startFocus(n.t.id)},300);
if(db.activeSession)renderSessionPill();
setInterval(()=>{if(db.activeSession&&$('#focus').hidden)renderSessionPill()},30000);
let lastDay=iso();setInterval(()=>{if(iso()!==lastDay){lastDay=iso();render()}},60000);
})();
