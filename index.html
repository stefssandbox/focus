function inboxRow(t){
  return taskRow(t,{flash:flashId===t.id}).replace('<span class="task-tools">',`<span class="task-tools" style="opacity:1"><button class="tool" data-a="link" data-id="${t.id}" aria-label="Koppel aan objective: ${esc(t.title)}" title="Koppelen aan een Key Result">${I('link')}</button>`);
}

function markPlanned(){const t=iso();if(!db.planDays.includes(t)){db.planDays.push(t);db.planDays=db.planDays.slice(-120)}}
function workdays(n){const out=[];const d=new Date();d.setHours(12);while(out.length<n){if(d.getDay()%6!==0)out.unshift(iso(d));d.setDate(d.getDate()-1)}return out}
function rhythm(){const days=workdays(10),planned=days.map(x=>db.planDays.includes(x)),weeks=[];for(let i=7;i>=0;i--){const ws=addDays(iso(),-((new Date().getDay()+6)%7)-7*i),we=addDays(ws,7);weeks.push(db.checkins.some(c=>c.date>=ws&&c.date<we))}
  let missRun=0;for(let i=weeks.length-2;i>=0&&!weeks[i];i--)missRun++;return{days,planned,weeks,missRun}}
function rhythmBlock(){const r=rhythm(),pd=r.planned.filter(Boolean).length,cw=r.weeks.filter(Boolean).length;
  return `<section class="section rhythm" aria-labelledby="rhH"><div class="sec-head"><h2 id="rhH">Ritme</h2><span class="small">geen reeksen, wel richting</span></div>
   <div class="rh-row"><span class="rh-l">Dag gepland</span><span class="rh-dots">${r.planned.map((x,i)=>`<i class="${x?'on':''} ${r.days[i]===iso()?'today':''}" title="${fmt(r.days[i])}"></i>`).join('')}</span><span class="rh-n num">${pd}/10 werkdagen</span></div>
   <div class="rh-row"><span class="rh-l">Check-in</span><span class="rh-dots wk">${r.weeks.map((x,i)=>`<i class="${x?'on':''} ${i===7?'today':''}"></i>`).join('')}</span><span class="rh-n num">${cw}/8 weken</span></div>
   ${balanceRow()}
   <p class="small" style="margin:8px 0 0">Een vaste routine kost gemiddeld zo'n twee maanden. Eén keer missen is geen probleem; telkens terugkomen telt.</p></section>`}
function checkinDue(){const l=db.checkins[0];return !l||dayDiff(iso(),l.date)>=7}
let ciShowAll=false,ciJustSaved=null;
function krMoved(k,from){
  const t=db.tasks.filter(x=>x.krId===k.id);
  if(k.evidence.some(e=>e.done&&e.doneAt&&e.doneAt>=from))return 'bewijs vastgelegd';
  if(t.some(x=>x.done&&x.doneAt&&x.doneAt>=from))return 'actie afgerond';
  if(t.some(x=>!x.done&&x.waiting))return 'een actie wacht';
  if(t.some(x=>!x.done&&x.due&&x.due<=addDays(iso(),7)))return 'deadline nadert';

  cap={objectiveId:ctx.objectiveId||'',krId:ctx.krId||'',today:!!ctx.today,sel:0,added:[],items:[]};
  openLayer('capture',`<div class="palette"><div class="p-in">${I('plus')}<input id="capIn" autocomplete="off" placeholder="Leg een actie vast, zoek, of begin met ? voor AI" aria-label="Vastleggen of zoeken" aria-controls="capList" aria-autocomplete="list" maxlength="400" value="${esc(ctx.text||'')}" autofocus><span class="p-mode" id="capMode">TAAK</span></div><div class="p-ctx" id="capCtx"></div><div id="capAdded"></div><div class="p-list" id="capList" role="listbox" aria-label="Opties"></div><div class="p-foot"><span><kbd>↵</kbd> uitvoeren</span><span><kbd>↑</kbd><kbd>↓</kbd> kiezen</span><span><kbd>#</kbd> objective</span><span><kbd>/</kbd> commando's</span><span><kbd>?</kbd> AI</span><span><kbd>esc</kbd> sluiten</span></div></div>`,{cls:'dialog',label:'Vastleggen'});
  const inp=$('#capIn');inp.setSelectionRange(inp.value.length,inp.value.length);updateCapture();
}
function parseCapture(raw){
  let text=raw,o=cap.objectiveId,k=cap.krId,today=cap.today,mode='task';
  if(/^\s*\?/.test(raw))return{mode:'ai',text:raw.replace(/^\s*\?\s*/,'')};
  if(/^\s*\//.test(raw))return{mode:'cmd',text:raw.replace(/^\s*\//,'')};
  text=text.replace(/(^|\s)#([\p{L}\-]+?)(\d)?(?=\s|$)/gu,(m,sp,w,d)=>{const n=norm(w);const hit=objs().find(x=>norm(x.id).startsWith(n)||norm(x.name).startsWith(n));if(!hit)return m;o=hit.id;k=d&&hit.krs[d-1]?hit.krs[d-1].id:(k&&hit.krs.some(x=>x.id===k)?k:'');return sp});
  text=text.replace(/(^|\s)@?vandaag(?=\s|$)/i,(m,sp)=>{today=true;return sp});
  return{mode,text:clean(text.replace(/\s{2,}/g,' ')),o,k,today};
}
function updateCapture(){
  if(!cap)return;const raw=$('#capIn').value,p=parseCapture(raw),items=[];
  $('#capMode').textContent=p.mode==='ai'?'AI':p.mode==='cmd'?'COMMANDO':'ACTIE';$('#capMode').className='p-mode'+(p.mode==='ai'?' ai':'');
  const ctxEl=$('#capCtx');
  if(p.mode==='task'){
    const o=obj(p.o);
    ctxEl.hidden=false;
    ctxEl.innerHTML=`<div class="chips" role="group" aria-label="Objective">${objs().map(x=>`<button class="chip" data-a="cap-obj" data-id="${x.id}" aria-pressed="${p.o===x.id}"><span class="dot" style="--c:${x.color}"></span>${esc(x.name)}</button>`).join('')}<button class="chip" data-a="cap-today" aria-pressed="${p.today}">${I('sun')} Vandaag</button></div>${o?`<div class="chips" role="group" aria-label="Key Result">${o.krs.map((k,i)=>`<button class="chip" data-a="cap-kr" data-id="${k.id}" aria-pressed="${p.k===k.id}" title="${esc(k.title)}" aria-label="KR ${i+1}: ${esc(k.title)}">KR ${i+1}</button>`).join('')}<span class="small" style="align-self:center">${p.k?esc(krById(p.k).k.title):'Optioneel: kies een Key Result'}</span></div>`:''}`;
    if(p.text){const where=o?esc(o.name)+(p.k?' · KR '+krById(p.k).i:''):'Inbox';items.push({g:'',ic:'plus',b:`“${esc(p.text)}”`,s:`Toevoegen aan ${where}${p.today?' · vandaag':''}`,run:()=>addCaptured(p)})}
    else items.push({g:'',ic:'plus',b:'Typ een actie, bijvoorbeeld “Camiel bellen over use cases”',s:'Koppelen mag, hoeft niet. Zonder keuze landt het in je Inbox.',run:()=>{}});
    if(p.text.length>=2){const q=norm(p.text);const hits=[];
      for(const o of objs()){if(norm(o.name+' '+o.objective).includes(q))hits.push({g:'Ga naar',ic:'target',b:esc(o.name),s:esc(o.objective),run:()=>{closeLayer(true);go('/o/'+o.id)}});o.krs.forEach((k,i)=>{if(norm(k.title).includes(q))hits.push({g:'Ga naar',ic:'target',b:esc(k.title),s:`${esc(o.name)} · KR ${i+1}`,run:()=>{closeLayer(true);gotoKr(k.id)}})})}
      for(const t of db.tasks)if(norm(t.title).includes(q))hits.push({g:'Ga naar',ic:t.done?'check':'tasks',b:esc(t.title),s:(obj(t.objectiveId)?.name||'Inbox')+(t.done?' · afgerond':''),run:()=>taskSheet(t.id)});
      items.push(...hits.slice(0,7));
      items.push({g:'Of',ic:'spark',b:'Vraag AI hierover',s:'Maakt een briefing met je actuele context',run:()=>{closeLayer(true);aiSheet({q:p.text})}});
    }
  }else if(p.mode==='cmd'){
    ctxEl.hidden=true;const q=norm(p.text);
    const cmds=[['sun','Plan je dag','plannen vandaag',()=>planSheet()],['play','Start focus op je volgende actie','focus nu',()=>{const n=nextAction();n?startFocus(n.t.id):toast('Nog geen volgende actie. Plan eerst je dag.')}],['spark','AI-briefing maken','ai briefing chatgpt claude',()=>aiSheet({})],['spark','AI-voorstel plakken','plak voorstel ai',()=>aiSheet({paste:true})],['review','Check-in','check-in review week',()=>{closeLayer(true);go('/checkin')}],['tasks','Inbox','inbox taken',()=>{closeLayer(true);go('/taken/inbox')}],['plus','Nieuwe objective','objective nieuw',()=>objSheet()],['gear','Gegevens en back-up','export import backup gegevens',()=>settingsSheet()]];
    cmds.filter(c=>!q||norm(c[1]+' '+c[2]).includes(q)).forEach(c=>items.push({g:'',ic:c[0],b:c[1],s:'',run:c[3]}));
  }else{
    ctxEl.hidden=true;
    items.push({g:'',ic:'spark',b:p.text?`“${esc(p.text)}”`:'Stel een vraag aan je AI-assistent',s:'Focus maakt een briefing met je actuele OKR-context. Voorstellen die terugkomen bekijk je eerst.',run:()=>{closeLayer(true);aiSheet({q:p.text})}});
    [['Wat verdient deze week mijn aandacht?'],['Welke volgende stappen ontbreken per Key Result?'],['Waar verwar ik activiteit met resultaat?']].forEach(([q])=>items.push({g:'Voorbeelden',ic:'spark',b:q,s:'',run:()=>{closeLayer(true);aiSheet({q})}}));
  }
  cap.items=items;cap.sel=Math.min(cap.sel,items.length-1);if(cap.sel<0)cap.sel=0;
  let g=null;$('#capList').innerHTML=items.map((it,i)=>{const gh=it.g&&it.g!==g?`<div class="p-group">${it.g}</div>`:'';g=it.g;return gh+`<button class="p-item" role="option" id="opt${i}" data-a="cap-run" data-i="${i}" aria-selected="${i===cap.sel}"><span class="ic">${I(it.ic)}</span><span class="tx"><b>${it.b}</b>${it.s?`<span>${it.s}</span>`:''}</span>${i===cap.sel?'<kbd>↵</kbd>':''}</button>`}).join('');
  $('#capIn').setAttribute('aria-activedescendant','opt'+cap.sel);
  $('#capAdded').innerHTML=cap.added.length?`<div class="p-added">${I('check')} ${cap.added.length===1?'Toegevoegd':cap.added.length+' toegevoegd'}: ${esc(cap.added.at(-1))}</div>`:'';
}
function addCaptured(p){
  if(!p.text)return;
  const t={id:uid(),title:p.text,objectiveId:p.o||'',krId:p.k||'',notes:'',due:'',done:false,focus:false,waiting:false,blocker:'',today:p.today?iso():'',rank:Date.now(),doneAt:null,steps:[],created:iso()};
  db.tasks.push(t);log('create',t.title,t.objectiveId);save();render();
  cap.added.push(t.title);$('#capIn').value='';cap.sel=0;updateCapture();$('#capIn').focus();
}

let ai={q:'',scope:'',proposals:[]};
function briefing(){
  const t=iso(),scope=ai.scope?[obj(ai.scope)]:objs(),from=addDays(t,-13);
  const ctx={datum:t,kwartaal:quarter(),objectives:scope.map(o=>({id:o.id,naam:o.name,objective:o.objective,activiteit_7_dagen:momentum(o.id),laatste_voortgang:lastActivity(o.id),key_results:o.krs.map((k,i)=>({kr_id:k.id,nummer:i+1,resultaat:k.title,status:STATE[krState(k)],gemeten:k.current==null?null:k.current+' / '+k.target+' '+k.unit,behaald_wanneer:criterion(k),bewijs:k.evidence.map(e=>(e.done?'[x] ':'[ ] ')+e.title),hangt_af_van:k.dependsOn.map(id=>krLabel(id,o.id)),streefdatum:k.due||undefined,initiatieven:o.initiatives.filter(x=>x.krId===k.id&&x.status!=='done').map(x=>x.title),open_acties:open().filter(x=>x.krId===k.id).map(x=>({actie:x.title,vandaag:isToday(x)||undefined,weekfocus:x.focus||undefined,wacht_op:x.waiting?(x.blocker||'ja'):undefined,deadline:x.due||undefined}))})),afgerond_14_dagen:db.tasks.filter(x=>x.objectiveId===o.id&&x.done&&x.doneAt&&x.doneAt>=from).map(x=>x.title)})),
    inbox_ongekoppeld:inboxTasks().map(x=>x.title),signalen:signals().slice(0,8).map(s=>s.text),laatste_checkin:db.checkins[0]||null,laatste_weekreview:db.reviews[0]||null};
  const q=clean(ai.q)||'Wat verdient deze week mijn aandacht, en welke volgende stappen ontbreken?';
  return `Je bent mijn kritische sparringpartner voor OKR's. Ik werk als programmamanager Data en AI.\n\nMijn vraag: ${q}\n\nRegels:\n- Baseer je alleen op de context hieronder. Verzin geen voortgang, blokkades of prioriteiten die er niet staan; benoem wat ontbreekt.\n- Maak onderscheid tussen uitvoering (acties) en uitkomst (Key Results). Afgeronde acties zijn geen behaald resultaat.\n- Wees kort: maximaal drie aandachtspunten.\n- Stel je concrete acties voor, zet ze dan als losse regels in precies dit formaat, zodat ik ze kan importeren en eerst kan beoordelen:\n  - [kr_id] Korte actie in gebiedende wijs\n  Gebruik alleen bestaande kr_id's uit de context. Hoort een actie nergens bij, laat de haakjes dan weg.\n\nContext (${t}):\n${JSON.stringify(ctx,null,1)}`;
}
function aiSheet({q='',scope='',paste=false,v=''}={}){
  ai.q=q||(v==='review'?'Help me mijn weekreview voor te bereiden: wat is er feitelijk bereikt, wat schuurt, en wat zou volgende week moeten tellen?':ai.q);ai.scope=scope;ai.proposals=[];
  openLayer('ai',head(`${I('spark')} AI-assistent`)+`<div class="sheet-body"><p class="note" style="margin:0">Focus heeft geen eigen taalmodel. Het stelt een briefing samen met je actuele OKR-gegevens die je in Claude of ChatGPT plakt. Voorgestelde acties uit het antwoord zie je hier eerst; Key Results en metingen verandert AI nooit.</p>

   <div class="ai-step" id="aiReviewWrap" hidden><span class="no">3</span><div class="field"><span class="lbl">Beoordeel voordat er iets verandert</span><div id="aiReview"></div></div></div>
  </div></div>`,{label:'AI-assistent'});
  $('#aiBrief').textContent=briefing();
  if(paste)$('#aiAns').focus();

function parseProposals(text){
  const ids=new Map(db.objectives.flatMap(o=>o.krs.map(k=>[k.id.toLowerCase(),{o:o.id,k:k.id}])));
  const out=[];
  for(const line of text.split(/\r?\n/)){const m=line.match(/^\s*(?:[-*•]|\d+[.)]|\[\s?\])\s+(.+)$/);if(!m)continue;
    let s=m[1].replace(/\*\*|__|`/g,''),o='',k='';
    s=s.replace(/[\[(]\s*([a-z0-9-]+)\s*[\])]/i,(x,id)=>{const hit=ids.get(id.toLowerCase());if(hit){o=hit.o;k=hit.k;return ''}return x});
    s=s.replace(/(^|\s)#([\p{L}\-]+)/gu,(x,sp,w)=>{const hit=objs().find(oo=>norm(oo.id).startsWith(norm(w))||norm(oo.name).startsWith(norm(w)));if(hit&&!o){o=hit.id;return sp}return x});
    s=clean(s.replace(/^[:\-–\s]+/,''));if(s.length>2&&s.length<300)out.push({on:true,title:s,o,k});if(out.length>=30)break}
  return out;
}

}

/* ================= focus mode ================= */
const FKIND={notitie:'Notitie',inzicht:'Inzicht',blokkade:'Wacht op'};
let fTimer=null,fKind='notitie',fEnded=null;
function startFocus(id){
  const t=task(id);if(!t)return;closeLayer(true);
  if(db.activeSession&&db.activeSession.taskId!==id)finishSession(false);
  if(!db.activeSession)db.activeSession={taskId:id,start:Date.now(),notes:[],steps:0};
  save();fEnded=null;showFocus();
}
function showFocus(){const F=$('#focus');F.hidden=false;$('#app').inert=true;$('#tabbar').inert=true;renderFocus();clearInterval(fTimer);fTimer=setInterval(()=>{const el=$('#fTime');if(el&&db.activeSession)el.textContent=mins()+' min'},15000);renderSessionPill()}
function hideFocus(){const F=$('#focus');F.hidden=true;F.innerHTML='';$('#app').inert=false;$('#tabbar').inert=false;clearInterval(fTimer);render()}
const mins=()=>db.activeSession?Math.max(0,Math.round((Date.now()-db.activeSession.start)/60000)):0;
function renderFocus(){
  const F=$('#focus');
  if(fEnded){F.innerHTML=focusDone();$('#fNext')?.focus();return}
  const s=db.activeSession,t=s&&task(s.taskId);if(!t){hideFocus();return}
  const r=krOf(t),o=obj(t.objectiveId);
  F.innerHTML=`<header class="f-bar"><button class="btn ghost" data-a="focus-min" aria-label="Terug naar overzicht (sessie loopt door)">${I('back')}<span>Terug</span></button><div class="ctx" style="justify-content:center">${o?`<span class="dot" style="--c:${o.color}"></span>${esc(o.name)}${r?`<span class="krt">· KR ${r.i}</span>`:''}`:'Inbox'}</div><span class="f-time" id="fTime">${mins()} min</span></header>
  <div class="f-main"><div class="f-col" style="--c:${o?.color||'var(--accent)'}">
    ${r?`<div class="f-outcome">Gewenste uitkomst<b>${esc(r.k.title)}</b></div>`:''}
    <div><h1 class="f-title">${esc(t.title)}</h1>${t.waiting?`<p class="small" style="margin-top:8px"><span class="tag wait">Wacht${t.blocker?': '+esc(t.blocker):''}</span></p>`:''}</div>
    ${t.notes?`<details class="crit f-sec"><summary>Notities en context</summary><p class="f-notes">${esc(t.notes)}</p></details>`:''}
    <section class="f-sec"><h3><span>Stappen</span><span class="num">${t.steps.filter(x=>x.done).length}/${t.steps.length}</span></h3>${stepsList(t,'focus')}</section>
    <section class="f-sec"><h3>Vastleggen tijdens het werk</h3>
      <form class="f-cap" data-form="fcap"><div class="seg" role="group" aria-label="Soort">${['notitie','inzicht','blokkade'].map(k=>`<button type="button" data-a="fkind" data-v="${k}" aria-pressed="${fKind===k}">${FKIND[k]}</button>`).join('')}</div><input name="text" placeholder="${{notitie:'Gedachte of extra stap…',inzicht:'Wat heb je geleerd?',blokkade:'Waar wacht je op?'}[fKind]}" aria-label="Vastleggen" autocomplete="off" maxlength="300"></form>
      ${s.notes.length?`<ul class="caps">${s.notes.map(n=>`<li><span class="k ${n.type}">${FKIND[n.type].toLowerCase()}</span><span>${esc(n.text)}</span></li>`).join('')}</ul>`:''}
    </section>
  </div></div>
  <footer class="f-foot"><button class="btn" data-a="focus-end">Sessie afsluiten</button><button class="btn primary" data-a="focus-complete">${I('check')} Actie afgerond</button></footer>`;
}
function finishSession(completeTask){
  const s=db.activeSession;if(!s)return null;const t=task(s.taskId);db.activeSession=null;if(!t)return null;
  const m=Math.max(0,Math.round((Date.now()-s.start)/60000)),stepsDone=s.steps||0;
  if(s.notes.length){t.notes=clean((t.notes?t.notes+'\n\n':'')+`Focus ${fmt(iso())}:\n`+s.notes.map(n=>(n.type==='notitie'?'· ':FKIND[n.type]+': ')+n.text).join('\n'))}
  const bl=s.notes.filter(n=>n.type==='blokkade');if(bl.length){t.waiting=true;t.blocker=bl.at(-1).text}
  if(completeTask&&!t.done){t.done=true;t.doneAt=iso();t.focus=false;log('done',t.title,t.objectiveId)}
  const meaningful=m>=5||stepsDone||s.notes.length||completeTask;
  if(meaningful){db.sessions.unshift({id:uid(),taskId:t.id,objectiveId:t.objectiveId,krId:t.krId,date:iso(),minutes:m,steps:stepsDone,notes:s.notes.length});log('session',`Focus: ${t.title} (${m} min)`,t.objectiveId)}
  return{t,m,stepsDone,notes:s.notes,complete:completeTask,meaningful};
}
function focusDone(){
  const e=fEnded,t=e.t,r=krOf(t),o=obj(t.objectiveId);
  const krOpen=r?db.tasks.filter(x=>!x.done&&x.krId===r.k.id).length:null;
  const ins=e.notes.filter(n=>n.type==='inzicht').length,bl=e.notes.filter(n=>n.type==='blokkade').length;
  return `<div class="f-main"><div class="f-col"><div class="f-done"><div class="tick">${I('check')}</div><h1 class="f-title" style="font-size:24px">${e.complete?'Actie afgerond':'Sessie vastgelegd'}</h1><p class="muted" style="margin:0;max-width:44ch">${esc(t.title)}</p>
  <div class="f-facts"><span><b>${e.m}</b>minuten</span><span><b>${e.stepsDone}</b>${e.stepsDone===1?'stap':'stappen'}</span><span><b>${ins}</b>${ins===1?'inzicht':'inzichten'}</span>${bl?`<span><b>${bl}</b>wacht op</span>`:''}</div>
  ${o?`<p class="small" style="margin:0">${esc(o.name)}: ${plural(momentum(o.id),'activiteit','activiteiten')} deze week.${e.complete?' De KR-status verandert pas als jij die beoordeelt.':''}</p>`:''}
  ${bl?`<p class="small" style="margin:0">De actie staat nu op wachten: ${esc(t.blocker)}</p>`:''}
  <div class="f-next">
   ${r&&e.complete&&krOpen===0&&!achieved(r.k)?`<div class="note"><b style="color:var(--ink)">Geen open acties meer voor KR ${r.i}.</b> Is het resultaat behaald, of ontbreekt er nog een stap?<div class="row" style="margin-top:8px"><button class="btn" data-a="focus-goto-kr" data-id="${r.k.id}">Beoordeel KR ${r.i}</button></div></div>`:''}
   <form data-form="fnext" class="field"><label for="fNext">${e.complete?'Wat is de volgende actie?':'Waar pak je het straks weer op?'}</label><div class="row"><input class="input" id="fNext" name="title" placeholder="${e.complete?'Optioneel — komt bij hetzelfde Key Result':'Optioneel — wordt een stap'}" autocomplete="off"><button class="btn primary">Bewaar</button></div></form>
   <div class="row"><span class="spacer"></span><button class="btn" data-a="focus-close">Sluiten</button></div>
  </div></div></div></div>`;
}

/* ================= toast ================= */
function toast(msg,undo,label='Ongedaan maken'){
  const box=$('#toasts'),el=document.createElement('div');el.className='toast';el.setAttribute('role','status');
  el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button>'+label+'</button>':''}`;
  if(undo)el.querySelector('button').onclick=()=>{undo();el.remove()};
  box.replaceChildren(el);setTimeout(()=>el.remove(),undo?6000:2800);
}

const SB={url:'https://wmkicxbmutazwiojnyxw.supabase.co',key:'sb_publishable_mV08JMLyMRN1r03R13za0A_MAZLYFt6'};
const SESS_KEY='focus-sessie', PEND_KEY='focus-sync-wacht';
let sess=null, syncReady=false, syncTimer=null, syncInfo={at:null,err:null};
const rd=(k)=>{try{return localStorage.getItem(k)}catch{return null}};
const wr=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}};
function jwtPayload(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(p))))}catch{return {}}}
function setSess(s){sess=s;try{s?localStorage.setItem(SESS_KEY,JSON.stringify(s)):localStorage.removeItem(SESS_KEY)}catch{}}
function sessFromTokens(at,rt,expiresIn){const c=jwtPayload(at);return {access_token:at,refresh_token:rt,expires_at:Date.now()+(+expiresIn||3600)*1000,user_id:c.sub,email:c.email||''}}
/* Na een klik op de inloglink komen de tokens in de hash. Die halen we eruit voordat de router ze ziet. */
function captureAuthHash(){
  if(!/access_token=/.test(location.hash))return;
  const q=new URLSearchParams(location.hash.replace(/^#/,''));
  if(q.get('access_token'))setSess(sessFromTokens(q.get('access_token'),q.get('refresh_token'),q.get('expires_in')));
  history.replaceState(null,'',location.pathname+location.search);
}
function sessInit(){try{sess=JSON.parse(localStorage.getItem(SESS_KEY)||'null')}catch{sess=null}}
async function refresh(){
  if(!sess?.refresh_token)return false;
  try{
    const r=await fetch(SB.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sess.refresh_token})});
    if(!r.ok){setSess(null);return false}
    const j=await r.json();setSess(sessFromTokens(j.access_token,j.refresh_token,j.expires_in));return true;
  }catch{return false}
}
async function authFetch(path,opts={}){
  if(sess&&sess.expires_at-Date.now()<60000)await refresh();
  const go=()=>fetch(SB.url+path,{...opts,headers:{apikey:SB.key,'Content-Type':'application/json',Authorization:'Bearer '+(sess?.access_token||SB.key),...(opts.headers||{})}});
  let r=await go();
  if(r.status===401&&await refresh())r=await go();
  return r;
}
async function sendLink(email){
  const to=location.origin+location.pathname;
  const r=await fetch(SB.url+'/auth/v1/otp?redirect_to='+encodeURIComponent(to),{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({email,create_user:true})});
  return r.ok;
}

  const r=await authFetch('/rest/v1/focus_state?select=data,updated_at&user_id=eq.'+sess.user_id,{headers:{'Accept-Profile':'focus'}});

/* Eén wijziging = een push na 1,5 s. Lukt het niet (offline), dan blijft het "wachten" en probeert de app het opnieuw. */
function markDirty(){
  if(!sess||!syncReady)return;
  wr(PEND_KEY,'1');
  clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,1500);
}
async function syncNow(){
  if(!sess)return;
  try{await pushRemote();wr(PEND_KEY,null);syncInfo={at:new Date(),err:null}}
  catch(e){syncInfo={at:syncInfo.at,err:e.message};wr(PEND_KEY,'1')}

}
/* Bij opstarten: staat er lokaal iets open dat nog niet is weggeschreven, dan wint lokaal. Anders halen we de nieuwste versie op. */
async function startSync(){
  if(!sess){syncReady=true;return}
  syncReady=false;
  try{
    const remote=await pullRemote();
    if(rd(PEND_KEY)!=='1'&&remote?.data&&Object.keys(remote.data).length){db=remote.data;normalize();applyContentUpdates();save()}

  }catch(e){syncInfo={at:syncInfo.at,err:e.message}}

}
function syncLine(){
  if(!sess)return '';
  if(syncInfo.err)return 'Niet gesynchroniseerd, wordt opnieuw geprobeerd';
  if(rd(PEND_KEY)==='1')return 'Wachten op synchronisatie';
  return syncInfo.at?'Gesynchroniseerd om '+syncInfo.at.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}):'Nog niet gesynchroniseerd';
}

/* ================= pincode (slot op dit apparaat) ================= */
const PIN_KEY='focus-pin';
const ss=(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch{}};
const ssGet=(k)=>{try{return sessionStorage.getItem(k)}catch{return null}};
async function pinHash(pin,salt){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:200000,hash:'SHA-256'},key,256);
  return [...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function setPin(pin){const salt=crypto.randomUUID();wr(PIN_KEY,salt+':'+await pinHash(pin,salt));ss('focus-ontgrendeld','1')}
async function checkPin(pin){const [salt,h]=(rd(PIN_KEY)||':').split(':');return !!h&&(await pinHash(pin,salt))===h}
const pinSet=()=>!!rd(PIN_KEY);
const pinLocked=()=>pinSet()&&!ssGet('focus-ontgrendeld');
/* De slot-overlay vangt alle toetsen op, zodat sneltoetsen van de app niet achter het slot werken. */
function showLock(){
  let el=document.getElementById('lock');
  if(!el){el=document.createElement('div');el.id='lock';el.className='lock';document.body.appendChild(el)}
  let buf='';
  const draw=(msg='')=>{el.innerHTML=`<div class="lock-card" role="dialog" aria-label="Focus is vergrendeld"><div class="lock-title">Focus</div><div class="lock-dots" aria-label="${buf.length} van 4 cijfers">${[0,1,2,3].map(i=>`<i class="${i<buf.length?'on':''}"></i>`).join('')}</div><div class="lock-msg" role="status">${msg}</div><div class="lock-pad">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button type="button" data-k="${k}" aria-label="${k==='⌫'?'Wissen':k}">${k}</button>`).join('')}</div></div>`};
  const press=async(k)=>{
    if(k==='⌫'){buf=buf.slice(0,-1);draw();return}
    if(!/^\d$/.test(k)||buf.length>=4)return;
    buf+=k;draw();
    if(buf.length===4){
      if(await checkPin(buf)){ss('focus-ontgrendeld','1');el.remove();document.removeEventListener('keydown',onKey,true)}
      else{buf='';draw('Onjuiste pincode')}
    }
  };
  const onKey=(e)=>{
    if(!document.getElementById('lock'))return;
    e.stopImmediatePropagation();
    if(e.key==='Backspace')press('⌫');else if(/^\d$/.test(e.key))press(e.key);
  };
  el.onclick=(e)=>{const b=e.target.closest('button[data-k]');if(b)press(b.dataset.k)};
  document.addEventListener('keydown',onKey,true);
  draw();
}

        description:'Behaald wanneer geïntegreerd batenmanagement en Batenmanagement as a Service samen met de betrokken projectteams zijn geëvalueerd, de verbeterpunten zijn verwerkt en is vastgelegd wanneer en hoe het Lab welke vorm inzet.\n\nContext: Eind maart zijn er twee geteste werkwijzen en twee concrete cases.',
        due:'2027-03-31',
        evidence:['Beide vormen met de projectteams geëvalueerd','Verbeterpunten verwerkt in de twee aanpakken','Vastgelegd hoe het Lab ze in volgende projecten inzet']}
    };
    for(const k of o.krs){
      const n=NEW[k.id];if(!n)continue;
      k.title=n.title;k.description=n.description;if(n.due)k.due=n.due;
      const keepDone=(k.evidence||[]).filter(e=>e.done);
      const keep=k.evidenceSeeded===false?(k.evidence||[]):keepDone;
      k.evidence=[...keep,...n.evidence.map(t=>({id:uid(),title:t,done:false,doneAt:null}))];
      k.evidenceSeeded=true;
    }
    const ini=(id)=>o.initiatives.find(i=>i.id===id);
    if(ini('waarde-init-1')){ini('waarde-init-1').title='Service blueprint AI-inkoop (overkoepelend)';ini('waarde-init-1').description='Eén overkoepelende service blueprint voor de strategische opgave van AI-inkoop: fricties, verwachte baten en meetindicatoren, van As-Is naar To-Be naar Actual.'}
    for(const id of ['waarde-init-4','waarde-init-5'])if(ini(id))ini(id).krId='';
    if(!ini('waarde-init-6'))o.initiatives.push({id:'waarde-init-6',title:'Batenplannen per toepassing (afgetakt van de blueprint)',description:'Per geselecteerde toepassing in de oplossingsfase een eigen batenplan dat terug te voeren is op de overkoepelende blueprint.',krId:'waarde-kr-1',start:'',end:'',status:'active'});
    if(!ini('waarde-init-7'))o.initiatives.push({id:'waarde-init-7',title:'Evaluatie en verbeterronde met projectteams',description:'Beide vormen evalueren met de betrokken projectteams en vastleggen hoe het Lab ze in volgende projecten inzet.',krId:'waarde-kr-3',start:'',end:'',status:'active'});
    for(const t of db.tasks)if(['waarde-actie-7','waarde-actie-8','waarde-actie-9'].includes(t.id))t.krId='';
    contentNotice='Doelen Waardegedreven innoveren bijgewerkt. Een kopie van de vorige versie is bewaard.';
  }
  db.contentUpdates.push(WAARDE_UPDATE_ID);
}

/* ================= weekritme: vaste dagen per objective, thuis of kantoor ================= */
const WEEK_DEFAULT={1:{o:'inkoop',loc:'kantoor'},2:{o:'waarde',loc:'kantoor'},3:{o:'waarde',loc:'thuis'},4:{o:'inkoop',loc:'kantoor'},5:{o:'rest',loc:'thuis'}};
const WD=[[1,'Ma','maandag'],[2,'Di','dinsdag'],[3,'Wo','woensdag'],[4,'Do','donderdag'],[5,'Vr','vrijdag']];
const mainBuckets=()=>new Set(Object.values(db.settings.week||{}).map(x=>x.o).filter(x=>x&&x!=='rest'&&obj(x)));
const bucketOf=oid=>mainBuckets().has(oid)?oid:'rest';
const bucketName=b=>b==='rest'?'Overig':(obj(b)?.name||b);
const bucketColor=b=>b==='rest'?'var(--ink-4)':(obj(b)?.color||'var(--ink-4)');
function dayFocus(date=new Date()){
  const wd=date.getDay(),w=(db.settings.week||{})[wd];if(!w)return null;
  const o=w.o&&w.o!=='rest'?obj(w.o):null,rest=w.o==='rest';
  if(!o&&!rest)return null;
  return{wd,loc:w.loc==='thuis'?'thuis':'kantoor',o,rest,label:o?o.name:'Overige objectives'};
}
function inBucket(t,f){if(!f||!t.objectiveId)return false;if(f.o)return t.objectiveId===f.o.id;return !mainBuckets().has(t.objectiveId)}
/* Werk met mensen herkennen aan de titel. Grof, maar genoeg om de volgorde te bepalen. */
const SAMEN=/\b(met|bespreken|afstemmen|afspraak|afspraken|presenteren|presentatie|delen|toetsen|overleg|sessie|workshop|interview|spreken|kennismaking|kennismakingen|bellen|samen|doorlopen|ophalen|vakdag|team|stakeholders?)\b/i;
const modeOf=t=>t.mode||(SAMEN.test(t.title)?'samen':'solo');
const dayHint=f=>f.loc==='thuis'?'Thuisdag: kies werk dat diepe aandacht vraagt en laat AI de eerste versie maken.':'Kantoordag: kies acties waarvoor je mensen nodig hebt. Schrijfwerk past beter op een thuisdag.';
function dayChip(){const f=dayFocus();if(!f)return '';return `<span class="dayfocus" title="Weekritme: ${esc(f.label)}">${f.o?`<span class="dot" style="--c:${f.o.color}"></span>`:''}${esc(f.label)} · ${f.loc==='thuis'?'Thuis':'Kantoor'}</span>`}
function weekTargets(){const w=db.settings.week||{},c={};let n=0;for(const [d] of WD){const x=w[d];if(!x||!x.o)continue;const b=x.o==='rest'?'rest':(obj(x.o)?x.o:'rest');c[b]=(c[b]||0)+1;n++}
  return n?Object.fromEntries(Object.entries(c).map(([k,v])=>[k,Math.round(v/n*100)])):{}}
const targetsText=()=>{const t=weekTargets();return Object.keys(t).length?Object.entries(t).map(([k,v])=>`${bucketName(k)} ${v}%`).join(' · '):'Nog geen vaste dagen'};
/* Verdeling: focusminuten als die er zijn (minstens 30), anders afgeronde acties. */
function weekBalance(from,to){
  const ss=db.sessions.filter(s=>s.date>=from&&s.date<=to&&s.objectiveId),acc={};let basis='focusminuten';
  if(ss.reduce((a,s)=>a+(s.minutes||0),0)>=30){for(const s of ss){const b=bucketOf(s.objectiveId);acc[b]=(acc[b]||0)+(s.minutes||0)}}
  else{basis='afgeronde acties';for(const t of db.tasks)if(t.done&&t.doneAt&&t.doneAt>=from&&t.doneAt<=to&&t.objectiveId){const b=bucketOf(t.objectiveId);acc[b]=(acc[b]||0)+1}}
  const tot=Object.values(acc).reduce((a,b)=>a+b,0);if(!tot)return null;
  return{basis,share:Object.fromEntries(Object.entries(acc).map(([k,v])=>[k,Math.round(v/tot*100)]))};
}
function balanceText(from,to){const b=weekBalance(from,to),tg=weekTargets();if(!b)return '';const keys=[...new Set([...Object.keys(tg),...Object.keys(b.share)])];
  return `Verdeling (${b.basis}): ${keys.map(k=>`${bucketName(k)} ${b.share[k]||0}%`).join(' · ')}${Object.keys(tg).length?` (ritme ${keys.map(k=>tg[k]||0).join('/')})`:''}`}
function balanceRow(){const ws=addDays(iso(),-((new Date().getDay()+6)%7)),b=weekBalance(ws,iso()),tg=weekTargets();if(!Object.keys(tg).length)return '';
  const keys=[...new Set([...Object.keys(tg),...Object.keys(b?.share||{})])];
  return `<div class="rh-row"><span class="rh-l">Verdeling</span><span class="rh-bal">${b?keys.map(k=>`<span><i style="background:${bucketColor(k)}"></i>${esc(bucketName(k))} <b class="num">${b.share[k]||0}%</b> <small class="num">/ ${tg[k]||0}%</small></span>`).join(''):'<span>Deze week nog geen afgeronde acties of focussessies.</span>'}</span></div>`}
function weekEditor(){
  const w=db.settings.week||{},opts=[...objs().map(o=>[o.id,o.name]),['rest','Overige objectives'],['','Geen vaste focus']];
  return `<div class="field"><span class="lbl">Weekritme</span><div class="small">Vaste dagen per objective. Op die dag stelt Focus eerst acties uit die objective voor: op kantoor werk met mensen, thuis werk dat diepe aandacht vraagt.</div>
  <div class="wk-grid">${WD.map(([d,n,full])=>{const x=w[d]||{o:'',loc:'kantoor'};return `<span class="wk-d">${n}</span><select class="select" data-wk="${d}" data-wkf="o" aria-label="Focus op ${full}">${opts.map(([v,l])=>`<option value="${v}" ${(x.o||'')===v?'selected':''}>${esc(l)}</option>`).join('')}</select><select class="select" data-wk="${d}" data-wkf="loc" aria-label="Locatie op ${full}"><option value="kantoor" ${x.loc!=='thuis'?'selected':''}>Kantoor</option><option value="thuis" ${x.loc==='thuis'?'selected':''}>Thuis</option></select>`}).join('')}</div>
  <div class="row"><span class="small" id="wkSum">Verdeling: ${esc(targetsText())}</span><span class="spacer"></span><button class="btn" data-a="week-ics">Zet in agenda</button></div></div>`;
}
function downloadWeekIcs(){
  const w=db.settings.week||{},stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',ev=[];
  const escI=s=>String(s).replace(/([,;\\])/g,'\\$1');
  for(const [d] of WD){const x=w[d];if(!x||!x.o)continue;
    const dt=new Date();dt.setHours(12,0,0,0);while(dt.getDay()!==d)dt.setDate(dt.getDate()+1);
    const s=iso(dt),by=['SU','MO','TU','WE','TH','FR','SA'][d],name=x.o==='rest'?'Overige objectives':(obj(x.o)?.name||'Focus'),loc=x.loc==='thuis'?'thuis':'kantoor';
    ev.push('BEGIN:VEVENT','UID:focus-week-'+d+'-'+uid()+'@focus.local','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+s.replace(/-/g,''),'DTEND;VALUE=DATE:'+addDays(s,1).replace(/-/g,''),`RRULE:FREQ=WEEKLY;BYDAY=${by}`,'TRANSP:TRANSPARENT',`SUMMARY:${escI(`Focus · ${name} (${loc})`)}`,`DESCRIPTION:${escI(loc==='thuis'?'Thuisdag: diep werk en AI. Houd de ochtend vrij van overleg.':'Kantoordag: mensen spreken\, afstemmen en beslissen.')}`,'END:VEVENT')}
  if(!ev.length){toast('Stel eerst je weekritme in.');return}
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Focus OKR-cockpit//NL','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n');
  const u=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})),a=document.createElement('a');a.href=u;a.download='focus-weekritme.ics';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
}

/* boot */
captureAuthHash();sessInit();load();save();route=parseHash();render();startSync();if(pinLocked())showLock();if(contentNotice)toast(contentNotice);
if(db.activeSession)renderSessionPill();
setInterval(()=>{if(db.activeSession&&$('#focus').hidden)renderSessionPill()},30000);
let lastDay=iso();setInterval(()=>{if(iso()!==lastDay){lastDay=iso();render()}},60000);
})();
