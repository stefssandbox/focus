<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4EEE0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1626" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Focus — OKR-cockpit</title>
<style>
[hidden]{display:none!important}
:root{
  --bg:#F4EEE0;--rail:#EDE6D3;--surface:#FBF8F1;--sunken:#EFE8D6;--hover:#E8E0CB;
  --line:#DDD4BC;--line-2:#C9BFA4;
  --ink:#1B2A4E;--ink-2:#38466A;--ink-3:#586483;--ink-4:#7C8399;
  --accent:#264A6B;--accent-ink:#1F4363;--accent-soft:#E1E6E4;--accent-line:#B7C5CD;
  --ochre:#C5AC6B;--ochre-soft:#F0E6C8;
  --ok:#2F6B4A;--ok-soft:#E2EAD8;--ok-mid:#8DB596;
  --warn:#8A5A12;--warn-soft:#F2E4C2;--warn-mid:#D9A441;
  --bad:#A8302F;--bad-soft:#F3DAD3;
  --idle:#C5BCA6;
  --shadow-1:0 1px 1px rgba(27,42,78,.05),0 1px 3px rgba(27,42,78,.08);
  --shadow-2:0 2px 6px rgba(27,42,78,.07),0 16px 40px -8px rgba(27,42,78,.2);
  --r-s:6px;--r-m:8px;--r-l:12px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1626;--rail:#121B2E;--surface:#172036;--sunken:#121B2E;--hover:#1E2943;
  --line:#26314B;--line-2:#34415F;
  --ink:#F4EEE0;--ink-2:#D3CDBD;--ink-3:#A5A394;--ink-4:#7F8091;
  --accent:#8FB0CF;--accent-ink:#A9C4DC;--accent-soft:#1B2B44;--accent-line:#34506F;
  --ochre:#C5AC6B;--ochre-soft:#2B2615;
  --ok:#7CC49A;--ok-soft:#14261F;--ok-mid:#3F7F5C;
  --warn:#E3B05A;--warn-soft:#2A2110;--warn-mid:#8A6A2A;
  --bad:#EE8579;--bad-soft:#2C1618;--idle:#3A4560;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);--shadow-2:0 20px 50px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px 12px;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 14px;font-weight:650;letter-spacing:-.01em;font-size:15px}
.brand .mark{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand .mark svg{width:13px;height:13px;stroke-width:2.2}
.brand small{margin-left:auto;font-weight:500;font-size:11px;color:var(--ink-4)}
.capture-trigger{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 10px;margin:0 0 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);color:var(--ink-3);box-shadow:var(--shadow-1);transition:border-color .15s}
.capture-trigger:hover{border-color:var(--line-2);color:var(--ink-2)}
.capture-trigger span{flex:1}
kbd{font:500 11px/1 var(--mono);color:var(--ink-4);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--surface)}
.nav-label{font-size:11px;font-weight:600;color:var(--ink-4);padding:16px 10px 6px;display:flex;align-items:center;justify-content:space-between}
.nav-label button{color:var(--ink-4);width:22px;height:22px;display:grid;place-items:center;border-radius:4px}
.nav-label button:hover{background:var(--hover);color:var(--ink)}
.nav-item{display:flex;align-items:center;gap:10px;min-height:32px;padding:0 10px;border-radius:var(--r-s);color:var(--ink-2);font-weight:500;width:100%}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-item[aria-current]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),var(--shadow-1)}
.nav-item[aria-current] svg{color:var(--accent)}
.nav-item .count{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.nav-item .od{width:8px;height:8px;border-radius:50%;background:var(--c);margin:0 4px}
.nav-item .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-foot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:6px}
.save-state{font-size:12px;color:var(--ink-4);padding:0 10px;display:flex;align-items:center;gap:6px}
.save-state::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok-mid)}
.save-state.err::before{background:var(--bad)}
.session-pill{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-m);background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent-line);font-weight:500;font-size:13px;width:100%}
.session-pill .pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
.session-pill .t{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@keyframes pulse{50%{opacity:.35}}

main{min-width:0}
.page{max-width:1160px;margin:0 auto;padding:36px 48px 120px}
.page.narrow{max-width:860px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}
.eyebrow{font-size:12px;font-weight:500;color:var(--ink-3);margin-bottom:6px}
h1{font-size:26px;line-height:1.2;font-weight:650;letter-spacing:-.022em;margin:0}
h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.005em}
h3{font-size:14px;font-weight:600;margin:0}
.lede{color:var(--ink-2);font-size:15px;margin:8px 0 0;max-width:62ch}
.muted{color:var(--ink-3)}
.small{font-size:12.5px;color:var(--ink-3)}
.section{margin-top:36px}
.section:first-child{margin-top:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .n{color:var(--ink-4);font-weight:500;margin-left:6px;font-variant-numeric:tabular-nums}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-s);font-weight:500;font-size:13.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);transition:background .12s,border-color .12s,transform .08s;white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:var(--sunken)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 1px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.12)}
.btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{border-color:transparent;box-shadow:none;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.lg{height:40px;padding:0 16px;font-size:14px}
.btn.icon{width:32px;padding:0}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--accent-ink);font-weight:500;font-size:13px;border-radius:4px}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}

/* ---------- cockpit ---------- */
.cockpit{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:48px;align-items:start}
.summary{font-size:15px;color:var(--ink-2);margin-top:8px}
.summary b{color:var(--ink);font-weight:600}
.now{position:relative;border:1px solid var(--line);border-radius:var(--r-l);padding:22px 24px 20px;background:var(--surface);box-shadow:var(--shadow-1)}
.now::before{content:"";position:absolute;left:-1px;top:18px;bottom:18px;width:3px;border-radius:0 3px 3px 0;background:var(--c,var(--accent))}
.now .lbl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.06em}
.now .why{font-weight:500;color:var(--ink-4);text-transform:none;letter-spacing:0}
.now h2{font-size:20px;line-height:1.3;font-weight:620;letter-spacing:-.015em;margin:10px 0 6px}
.ctx{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:13px;flex-wrap:wrap}
.ctx .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.now .outcome{margin:14px 0 0;padding:12px 14px;background:var(--sunken);border-radius:var(--r-m);font-size:13px;color:var(--ink-2)}
.now .outcome b{display:block;font-size:11.5px;font-weight:600;color:var(--ink-3);margin-bottom:2px}
.now .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.empty-now{border:1px dashed var(--line-2);border-radius:var(--r-l);padding:28px 24px;text-align:left}
.empty-now h2{font-size:17px;margin-bottom:4px}

.carry{display:flex;align-items:center;gap:12px;padding:10px 14px;margin-top:16px;border-radius:var(--r-m);background:var(--warn-soft);color:var(--ink-2);font-size:13px}
.carry .spacer{flex:1}

/* tasks */
.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 6px 9px 4px;border-bottom:1px solid var(--line);position:relative;border-radius:0;transition:background .12s}
.task:hover{background:var(--sunken)}
.check{width:20px;height:20px;margin:1px 2px 0;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;transition:border-color .15s,background .15s;position:relative}
.check::after{content:"";position:absolute;inset:-12px}
.check svg{width:11px;height:11px;stroke:#fff;stroke-width:2.6;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s var(--ease)}
.check:hover{border-color:var(--ok)}
.is-done .check{background:var(--ok);border-color:var(--ok)}
.is-done .check svg{stroke-dashoffset:0}
.just-done .check{animation:pop .35s var(--ease)}
@keyframes pop{40%{transform:scale(1.22)}}
.task-main{flex:1;min-width:0;display:block;padding:0;border-radius:4px}
.task-title{display:block;color:var(--ink);font-weight:450;line-height:1.4}
.is-done .task-title{color:var(--ink-4);text-decoration:line-through;text-decoration-color:var(--line-2)}
.task-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:2px;font-size:12px;color:var(--ink-3)}
.task-meta .dot{width:6px;height:6px;border-radius:50%;background:var(--c);display:inline-block;margin-right:2px}
.task-meta .sep{font-style:normal;color:var(--ink-4)}
.tag{font-size:11.5px;font-weight:500;padding:0 6px;border-radius:4px;line-height:18px}
.tag.wait{background:var(--warn-soft);color:var(--warn)}
.tag.focus{background:var(--accent-soft);color:var(--accent-ink)}
.tag.late{background:var(--bad-soft);color:var(--bad)}
.task-tools{display:flex;gap:2px;opacity:0;transition:opacity .12s}
.task:hover .task-tools,.task:focus-within .task-tools{opacity:1}
.tool{width:28px;height:28px;border-radius:var(--r-s);display:grid;place-items:center;color:var(--ink-4)}
.tool:hover{background:var(--hover);color:var(--ink)}
.tool.on{color:var(--accent);opacity:1}
.task .tool.on{visibility:visible}
.task-tools:has(.on){opacity:1}
.add-line{display:flex;align-items:center;gap:10px;padding:8px 6px 8px 6px;color:var(--ink-4);border-bottom:1px solid transparent}
.add-line input{flex:1;border:0;background:none;outline:none;padding:4px 0;min-width:0;color:var(--ink)}
.add-line input::placeholder{color:var(--ink-4)}
.add-line:focus-within{border-bottom-color:var(--accent)}
.empty{padding:22px 4px;color:var(--ink-3);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-weight:600;font-size:14px;margin-bottom:2px}

/* direction list */
.dir{list-style:none;margin:0;padding:0}
.dir-row{display:block;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);border-radius:0}
.dir-row:hover{background:var(--sunken)}
.dir-top{display:flex;align-items:center;gap:8px}
.dir-top .nm{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir-top .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.dir-mid{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12px;color:var(--ink-3)}
.dir-note{margin-top:4px;font-size:12px;color:var(--warn)}
.pips{display:inline-flex;gap:3px}
.pip{width:14px;height:6px;border-radius:2px;background:var(--idle)}
.pip.done{background:var(--ok)}.pip.on{background:var(--ok-mid)}.pip.risk{background:var(--warn-mid)}.pip.blocked{background:var(--bad)}
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:16px}
.spark i{width:3px;border-radius:1px;background:var(--c);opacity:.85;min-height:2px}
.spark i.z{background:var(--line-2);opacity:1}

/* signals */
.signals{list-style:none;margin:0;padding:0}
.sig{display:flex;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.sig .g{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--idle)}
.sig .g.l0{background:var(--bad)}.sig .g.l1{background:var(--warn-mid)}.sig .g.l2{background:var(--ink-4)}
.sig .tx{flex:1;min-width:0}
.sig .tx b{font-weight:500;display:block}
.sig .tx span{font-size:12px;color:var(--ink-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sig .link{white-space:nowrap;margin-top:1px}

/* ---------- objective ---------- */
.switch{display:flex;gap:4px;margin:0 0 24px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.switch::-webkit-scrollbar{display:none}
.switch a{display:flex;align-items:center;gap:7px;padding:8px 10px 10px;color:var(--ink-3);text-decoration:none;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.switch a:hover{color:var(--ink)}
.switch a[aria-current]{color:var(--ink);border-color:var(--ink)}
.switch .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.obj-head{display:flex;gap:24px;justify-content:space-between;align-items:flex-start}
.obj-head .statement{font-size:19px;line-height:1.4;font-weight:500;letter-spacing:-.012em;color:var(--ink);margin:6px 0 0;max-width:46ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:26px 0 8px;border:1px solid var(--line);border-radius:var(--r-l)}
.stat{padding:14px 16px;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat .k{font-size:12px;color:var(--ink-3);font-weight:500}
.stat .v{font-size:20px;font-weight:620;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:10px}
.stat .v small{font-size:13px;color:var(--ink-3);font-weight:500}
.stat .d{font-size:12px;color:var(--ink-3);margin-top:2px}
.explain{font-size:12px;color:var(--ink-4);margin:0 0 8px}
.kr{padding:28px 0 8px;border-top:1px solid var(--line);scroll-margin-top:24px}
.kr:first-of-type{border-top:0}
.kr-head{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px 12px;align-items:start}
.kr-no{font:600 12px/24px var(--mono);color:var(--ink-4)}
.kr-title{font-size:16.5px;line-height:1.35;font-weight:600;letter-spacing:-.01em;margin:0}
.kr-body{grid-column:2/4}
.kr.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%,30%{background:var(--accent-soft)}100%{background:transparent}}
details.crit{margin-top:8px}
details.crit summary{cursor:pointer;color:var(--ink-3);font-size:13px;list-style:none;display:inline-flex;align-items:center;gap:4px;border-radius:4px}
details.crit summary::-webkit-details-marker{display:none}
details.crit summary::before{content:"";width:0;height:0;border:4px solid transparent;border-left:5px solid currentColor;margin-right:2px;transition:transform .15s}
details.crit[open] summary::before{transform:rotate(90deg) translateX(2px)}
details.crit p{margin:8px 0 0;color:var(--ink-2);font-size:13.5px;white-space:pre-line;max-width:72ch;line-height:1.55}
.measure{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-m);padding:2px;background:var(--sunken);gap:2px}
.seg button{height:28px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.seg .d{width:7px;height:7px;border-radius:50%;background:var(--idle)}
.seg .d.on{background:var(--ok-mid)}.seg .d.risk{background:var(--warn-mid)}.seg .d.blocked{background:var(--bad)}
.achieve{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--r-m);border:1px solid var(--line);font-weight:500;font-size:13px;color:var(--ink-2)}
.achieve:hover{border-color:var(--line-2)}
.achieve[aria-pressed=true]{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.achieve .box{width:14px;height:14px;border-radius:4px;border:1.5px solid currentColor;display:grid;place-items:center}
.achieve[aria-pressed=true] .box{background:var(--ok);border-color:var(--ok)}
.achieve .box svg{width:9px;height:9px;stroke:#fff;stroke-width:3;fill:none}
.numfield{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3)}
.numfield input{width:72px;height:32px;border:1px solid var(--line);border-radius:var(--r-s);padding:0 8px;background:var(--surface);font-variant-numeric:tabular-nums}
.inits{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;align-items:center}
.init{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:13px;background:var(--sunken);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);max-width:100%}
.init span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.init:hover{border-color:var(--line-2);color:var(--ink)}
.init.paused{opacity:.6}.init.done{text-decoration:line-through;color:var(--ink-4)}
.init.add{background:none;border-style:dashed;color:var(--ink-3)}
.kr .tasks{margin-top:14px;border-top:1px solid var(--line)}
.toggle-done{font-size:12.5px;color:var(--ink-3);padding:8px 4px;display:inline-flex;gap:4px;align-items:center;border-radius:4px}
.toggle-done:hover{color:var(--ink)}

/* ---------- tasks page ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:8px 12px 10px;color:var(--ink-3);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a[aria-current]{color:var(--ink);border-color:var(--ink)}
.tabs a .n{color:var(--ink-4);margin-left:4px;font-variant-numeric:tabular-nums}
.inbox-tools{display:flex;gap:2px;align-items:center}

/* ---------- review ---------- */
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px}
.fact-obj{padding:14px 0;border-bottom:1px solid var(--line)}
.fact-obj ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2);font-size:13.5px}
.fact-obj li{margin:2px 0}
.qs{display:grid;gap:18px;margin-top:18px}
.field{display:grid;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:500;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--ink-4)}
.input,.textarea,.select{width:100%;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);padding:8px 10px;min-height:36px;transition:border-color .12s,box-shadow .12s}
.textarea{min-height:76px;resize:vertical;line-height:1.5}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.past{padding:14px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.past dl{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;margin:8px 0 0}
.past dt{color:var(--ink-3)}.past dd{margin:0;color:var(--ink-2)}

/* ---------- overlays ---------- */
.layer{position:fixed;inset:0;z-index:40;display:flex}
.scrim{position:absolute;inset:0;background:rgba(15,20,30,.28);animation:fade .18s var(--ease)}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;background:var(--surface);box-shadow:var(--shadow-2);display:flex;flex-direction:column;max-height:100%;outline:none}
.sheet.drawer{margin-left:auto;width:min(480px,100%);height:100%;border-left:1px solid var(--line);animation:slideIn .22s var(--ease)}
.sheet.dialog{margin:10vh auto auto;width:min(620px,calc(100% - 32px));border-radius:var(--r-l);border:1px solid var(--line);max-height:80vh;animation:rise .18s var(--ease)}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--line)}
.sheet-head h2{flex:1;font-size:15px}
.sheet-head .saved{font-size:12px;color:var(--ink-4);opacity:0;transition:opacity .2s}
.sheet-head .saved.show{opacity:1}
.sheet-body{padding:18px 20px 24px;overflow-y:auto;display:grid;gap:18px;align-content:start}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.title-input{font-size:17px;font-weight:600;letter-spacing:-.01em;border:0;padding:4px 0;background:none;width:100%;outline:none;resize:none;line-height:1.35}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line);font-size:12.5px;font-weight:500;color:var(--ink-2);background:var(--surface)}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=true] .dot{box-shadow:0 0 0 1.5px var(--bg)}
.steps{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.step{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.step .check{width:18px;height:18px}
.step span{flex:1;padding-top:1px}
.step.is-done span{color:var(--ink-4);text-decoration:line-through}
.step .tool{opacity:.0}.step:hover .tool,.step:focus-within .tool{opacity:1}
.linkpick{display:grid;gap:14px}
.linkpick .og{display:grid;gap:2px}
.linkpick .og-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:4px 0}
.linkpick .og-h .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.pick{display:flex;gap:10px;padding:8px 10px;border-radius:var(--r-s);font-size:13.5px;color:var(--ink-2);text-align:left;width:100%;border:1px solid transparent}
.pick:hover{background:var(--sunken)}
.pick[aria-pressed=true]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent-line)}
.pick b{font:600 12px/20px var(--mono);color:var(--ink-4);flex:none}

/* palette */
.palette .p-in{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.palette .p-in input{flex:1;border:0;outline:none;background:none;font-size:17px;min-width:0}
.palette .p-in input::placeholder{color:var(--ink-4)}
.p-mode{font:600 11px/1 var(--mono);padding:4px 6px;border-radius:4px;background:var(--sunken);color:var(--ink-3);white-space:nowrap}
.p-mode.ai{background:var(--accent-soft);color:var(--accent-ink)}
.p-ctx{padding:10px 18px;display:grid;gap:8px;border-bottom:1px solid var(--line);background:var(--sunken)}
.p-ctx .chip{height:26px}
.p-list{overflow-y:auto;padding:6px;max-height:46vh}
.p-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:var(--r-s);color:var(--ink-2)}
.p-item .ic{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--sunken);color:var(--ink-3);flex:none}
.p-item .tx{flex:1;min-width:0}
.p-item .tx b{display:block;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-item .tx span{display:block;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-item[aria-selected=true]{background:var(--accent-soft)}
.p-item[aria-selected=true] .ic{background:var(--accent);color:#fff}
.p-group{font-size:11.5px;font-weight:600;color:var(--ink-4);padding:10px 12px 4px}
.p-foot{display:flex;gap:14px;padding:9px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-4);flex-wrap:wrap}
.p-added{padding:8px 18px;font-size:12.5px;color:var(--ok);display:flex;gap:6px;align-items:center}

/* ai */
.ai-steps{display:grid;gap:22px}
.ai-step{display:grid;grid-template-columns:24px 1fr;gap:12px}
.ai-step .no{width:24px;height:24px;border-radius:50%;background:var(--sunken);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-3)}
.brief{white-space:pre-wrap;font:12px/1.5 var(--mono);background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-s);padding:10px;max-height:200px;overflow:auto;margin-top:8px;color:var(--ink-2)}
.proposal{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.proposal input[type=checkbox]{width:16px;height:16px;margin-top:9px;accent-color:var(--accent)}
.proposal .pf{display:grid;gap:6px}
.note{font-size:12.5px;color:var(--ink-3);background:var(--sunken);border-radius:var(--r-s);padding:10px 12px}

/* focus mode */
.focus{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:fade .2s var(--ease)}
.f-bar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.f-bar .ctx{flex:1;min-width:0}
.f-time{font:500 13px var(--mono);color:var(--ink-3);display:flex;align-items:center;gap:6px}
.f-time::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
.f-main{flex:1;overflow-y:auto}
.f-col{max-width:680px;margin:0 auto;padding:48px 24px 120px;display:grid;gap:30px}
.f-outcome{font-size:13px;color:var(--ink-3);border-left:2px solid var(--c,var(--accent));padding:2px 0 2px 12px}
.f-outcome b{display:block;color:var(--ink);font-weight:550;font-size:14px;margin-top:2px}
.f-title{font-size:28px;line-height:1.25;font-weight:650;letter-spacing:-.022em;margin:0}
.f-sec h3{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;justify-content:space-between}
.f-notes{white-space:pre-line;color:var(--ink-2);font-size:14px;max-height:180px;overflow:auto}
.f-cap{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:var(--r-m);padding:4px 4px 4px 4px;background:var(--surface)}
.f-cap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f-cap input{flex:1;border:0;outline:none;background:none;min-width:0;padding:6px 4px}
.f-cap .seg{border:0;background:none}
.caps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.caps li{font-size:13.5px;color:var(--ink-2);display:flex;gap:8px}
.caps .k{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--sunken);color:var(--ink-3);height:18px;white-space:nowrap}
.caps .k.inzicht{background:var(--accent-soft);color:var(--accent-ink)}
.caps .k.blokkade{background:var(--warn-soft);color:var(--warn)}
.f-foot{display:flex;gap:8px;justify-content:center;padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
.f-done{text-align:center;display:grid;gap:14px;justify-items:center;padding-top:8vh}
.f-done .tick{width:48px;height:48px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;animation:pop .45s var(--ease)}
.f-done .tick svg{width:22px;height:22px;stroke-width:2.4}
.f-facts{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;color:var(--ink-3);font-size:13px}
.f-facts b{display:block;font-size:20px;color:var(--ink);font-weight:620;font-variant-numeric:tabular-nums}
.f-next{width:100%;max-width:460px;text-align:left;border-top:1px solid var(--line);padding-top:18px;margin-top:6px;display:grid;gap:10px}

/* toast */
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;display:grid;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;background:#1a1f36;color:#fff;padding:10px 12px 10px 14px;border-radius:var(--r-m);box-shadow:var(--shadow-2);font-size:13.5px;animation:rise .2s var(--ease);max-width:calc(100vw - 32px)}
.toast button{color:#b9b5ff;font-weight:600;font-size:13px;padding:2px 4px;border-radius:4px}
@media (prefers-color-scheme:dark){.toast{background:#F4EEE0;color:#0F1626}.toast button{color:var(--accent-line)}}

.tabbar{display:none}
.mobile-head{display:none}

/* ---------- responsive ---------- */
@media (max-width:1100px){.cockpit{grid-template-columns:minmax(0,1fr);gap:36px}.page{padding:32px 32px 120px}}
@media (max-width:860px){
  body{font-size:15px}
  .app{display:block}
  .rail{display:none}
  .page{padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
  .mobile-head{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
  .mobile-head .ttl{flex:1;font-weight:600;font-size:16px}
  .mobile-head .btn.icon{width:40px;height:40px}
  h1{font-size:23px}
  .top{flex-direction:column;align-items:flex-start;gap:14px;margin-bottom:20px}
  .now{padding:18px 18px 16px}
  .now h2{font-size:19px}
  .now .acts .btn{height:44px;flex:1}
  .task{padding:11px 2px;min-height:52px}
  .task-tools{opacity:1}
  .tool{width:40px;height:40px;margin:-8px 0}
  .tool:not(.on){color:var(--ink-4)}
  .check{width:22px;height:22px}
  .btn{height:40px}
  .btn.icon{width:40px}
  .seg button{height:34px}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .kr-head{grid-template-columns:1fr}
  .kr-no{line-height:1}
  .kr-body{grid-column:1}
  .kr-head > .btn{position:absolute;right:0}
  .kr{position:relative}
  .obj-head{flex-direction:column}
  .obj-head .statement{font-size:17px}
  .facts{grid-template-columns:1fr}
  .input,.textarea,.select,.add-line input,.palette .p-in input,.f-cap input{font-size:16px}
  .grid2{grid-template-columns:1fr}
  .layer{align-items:flex-end}
  .sheet.drawer,.sheet.dialog{margin:0;width:100%;height:auto;max-height:calc(100% - 40px - env(safe-area-inset-top));border-radius:16px 16px 0 0;border:0;animation:sheetUp .26s var(--ease);padding-bottom:env(safe-area-inset-bottom)}
  .sheet::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:8px auto 0;flex:none}
  @keyframes sheetUp{from{transform:translateY(40px);opacity:.4}}
  .palette .p-list{max-height:none}
  .p-foot{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;color:var(--ink-3);font-size:10.5px;font-weight:500;text-decoration:none;position:relative}
  .tabbar svg.i{width:22px;height:22px}
  .tabbar [aria-current]{color:var(--accent-ink)}
  .tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;display:grid;place-items:center}
  .tabbar .plus span{width:48px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px -2px rgba(99,91,255,.45)}
  .tabbar .plus svg.i{width:22px;height:22px;stroke-width:2.2}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom))}
  .session-float{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:25}
  .f-col{padding:28px 18px 40px;gap:24px}
  .f-title{font-size:23px}
  .f-bar{padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  .f-bar .ctx .krt{display:none}
  .f-foot .btn{flex:1;height:46px}
}
@media (min-width:861px){.session-float{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.cockpit>*{min-width:0}
.nav-item{text-decoration:none}
.sheet{min-width:0;max-width:100%}
.sheet-body{grid-template-columns:minmax(0,1fr)}
.sheet-body .row{flex-wrap:wrap}
body:has(#focus:not([hidden])) .toasts{bottom:96px}
@media (max-width:860px){.hide-m{display:none!important}.layer{flex-direction:column;justify-content:flex-end}.sheet.drawer,.sheet.dialog{flex:none}}
@media (max-width:860px){
  .measure .seg{display:flex;width:100%}
  .measure .seg button{flex:1;justify-content:center;padding:0 4px;font-size:12px}
  .kr-title{padding-right:40px}
  .kr-head > .btn{top:20px}
  .kr-body{min-width:0}
  .task-meta{min-width:0}
}
main{overflow-x:clip}
.switch,.switch a,.mobile-head .ttl{position:relative}
.title-input{min-height:52px;field-sizing:content;display:block;color:var(--ink)}
.f-col{grid-template-columns:minmax(0,1fr)}
@media (max-width:860px){.f-cap{flex-wrap:wrap}.f-cap .seg{width:100%;display:flex}.f-cap .seg button{flex:1;justify-content:center}.f-cap input{padding:8px}}

/* ===== v8.1 objective: hero, views ===== */
.ohero{position:relative;overflow:hidden;background:#1B2A4E;color:#fff;isolation:isolate}
.ohero .glow{position:absolute;border-radius:50%;filter:blur(14px);z-index:-1;pointer-events:none}
.ohero .g1{right:-160px;top:-280px;width:760px;height:600px;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 70%,#C5AC6B),color-mix(in srgb,var(--c) 30%,transparent) 50%,transparent 75%);opacity:.75}
.ohero .g2{right:240px;top:-220px;width:600px;height:500px;background:radial-gradient(closest-side,rgba(38,74,107,.85),rgba(197,172,107,.2) 55%,transparent 80%)}
.ohero-in{max-width:1160px;margin:0 auto;padding:22px 48px 26px}
.ohero-nav{display:flex;align-items:center;gap:16px}
.oswitch{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.oswitch::-webkit-scrollbar{display:none}
.oswitch a{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:15px;color:#adbdcc;text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap}
.oswitch a:hover{color:#fff;background:rgba(255,255,255,.06)}
.oswitch a[aria-current]{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.oswitch a i{width:7px;height:7px;border-radius:50%}
.oswitch svg.i{width:14px;height:14px}
.ohero-actions{display:flex;gap:6px;flex:none}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;color:#fff;font-size:13px;font-weight:500;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.hbtn:hover{background:rgba(255,255,255,.08)}
.hbtn.solid{background:#fff;color:#0a2540;box-shadow:none;font-weight:600}
.hbtn.solid:hover{background:#e9edff}
.ohero :focus-visible{outline-color:#fff}
.ohero-eyebrow{margin-top:34px;font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 45%,#ffd2a8)}
.ohero-h1{margin:10px 0 0;font-size:34px;line-height:1.16;font-weight:650;letter-spacing:-.028em;max-width:32ch;text-wrap:balance}
.otiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:30px}
.otile{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:#fff;transition:background .15s,transform .15s;min-width:0}
button.otile:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.otile-k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#9fb3ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.otile-k span{letter-spacing:.02em;text-transform:none;font-weight:600;color:#c7d2ee}
.otile-v{display:flex;align-items:baseline;gap:8px}
.otile-v b{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.otile-v b.dim{color:#7d8fa6}
.otile-v em{font-style:normal;font-size:12.5px;color:#adbdcc}
.otile-v em.st-on,.otile-v em.st-done{color:#7ff0bd}.otile-v em.st-risk{color:#ffc46b}.otile-v em.st-blocked{color:#ff9aae}
.otile-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.otile-bar i{display:block;height:100%;border-radius:2px;background:#9fb3ff}
.otile-bar i.st-on,.otile-bar i.st-done{background:linear-gradient(90deg,#00d4ff,#7ff0bd)}.otile-bar i.st-risk{background:linear-gradient(90deg,#ff9933,#ffc46b)}.otile-bar i.st-blocked{background:#ff6b8b}
.otile.next{background:rgba(255,255,255,.96);color:#0a2540;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.otile.next .next-t{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.otile.next .link{display:inline-flex;align-items:center;gap:4px;color:var(--accent-ink);margin-top:auto}
.otile.next .link svg{width:13px;height:13px}

.qstrip{margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.qhead,.qfoot{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#adbdcc}
.qhead span:first-child{font-weight:600;color:#fff}
.qcells{display:flex;gap:3px;margin:9px 0 7px}
.qcells i{flex:1;height:10px;border-radius:3px;background:rgba(255,255,255,.1);position:relative}
.qcells i.qpast{background:rgba(197,172,107,.55)}
.qcells i.qnow{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.qcells i.ms::after{content:"◆";position:absolute;left:50%;top:-15px;transform:translateX(-50%);font-size:10px;color:#ffc46b}
.qms{color:#ffc46b;font-size:12px}
button.qms:hover{text-decoration:underline}

.obj-page{padding-top:22px}
.view-bar{display:flex;align-items:center;gap:16px;justify-content:space-between;margin-bottom:6px}
.viewseg button svg.i{width:14px;height:14px}
.sbadge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunken);color:var(--ink-3)}
.sbadge.done,.sbadge.on{background:var(--ok-soft);color:var(--ok)}
.sbadge.risk{background:var(--warn-soft);color:var(--warn)}
.sbadge.blocked{background:var(--bad-soft);color:var(--bad)}
.trend{display:inline-flex;gap:3px;align-items:center}
.trend i{width:7px;height:7px;border-radius:50%}
.trend i:last-child{width:9px;height:9px}
.dep{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:500;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.dep.ok{color:var(--ok)}
.dep.bad{color:var(--bad);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 40%,transparent)}
.lbl-s{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.st-done,.st-on{color:var(--ok)}.st-risk{color:var(--warn)}.st-blocked{color:var(--bad)}.st-unknown{color:var(--ink-4)}

.bk{display:grid;grid-template-columns:88px minmax(0,1fr) 320px;gap:28px;padding:34px 0;border-top:1px solid var(--line);scroll-margin-top:16px}
.view-bar + .bk{border-top:0}
.bk.flash{animation:flash 1.4s var(--ease)}
.bk-num{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.bk-num > span{font-size:52px;font-weight:300;letter-spacing:-.045em;line-height:.85;font-variant-numeric:tabular-nums}
.bk-num > span.st-unknown{color:var(--line-2)}
.spine{display:block;width:4px;height:120px;border-radius:2px;background:var(--line);position:relative;overflow:hidden;margin-left:4px}
.spine b{position:absolute;left:0;right:0;top:0;border-radius:2px;transition:height .4s var(--ease)}
.bk-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bk-title{margin:10px 0 0;font-size:21px;line-height:1.3;font-weight:620;letter-spacing:-.017em;text-wrap:balance}
.bk-crit{margin:8px 0 0;color:var(--ink-2);font-size:14.5px;line-height:1.55;max-width:66ch}
.ev-head{display:flex;align-items:baseline;gap:12px;margin:20px 0 8px}
.evs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ev{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:8px;font-size:13.5px;line-height:1.4;text-align:left;box-shadow:inset 0 0 0 1px var(--line);background:var(--surface);color:var(--ink-2);transition:background .15s,box-shadow .15s}
button.ev:hover{box-shadow:inset 0 0 0 1px var(--line-2)}
.ev span:not(.evb){flex:1}
.ev em{font-style:normal;font-size:11.5px;color:var(--ok);white-space:nowrap}
.evb{width:18px;height:18px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1.5px var(--line-2);display:grid;place-items:center;margin-top:-1px}
.evb svg{width:11px;height:11px;stroke:#fff;stroke-width:2.8;fill:none;opacity:0}
.ev.on{background:var(--ok-soft);box-shadow:none;color:var(--ink)}
.ev.on .evb{background:var(--ok);box-shadow:none}
.ev.on .evb svg{opacity:1}
.ev.add{box-shadow:inset 0 0 0 1px var(--line);background:none;border:0;box-shadow:inset 0 0 0 1px transparent;outline:1px dashed var(--line-2);outline-offset:-1px}
.ev.add input{flex:1;border:0;background:none;outline:none;min-width:0;font-size:13.5px;padding:0}
.evb.plus{box-shadow:none;color:var(--ink-4);font-weight:500}
.bk .measure{margin-top:18px}
.bk-side{padding-top:6px}
.bk-side .inits{margin:10px 0 0}
.bk-side .tasks{margin-top:12px;border-top:1px solid var(--line)}

.map{position:relative;padding:28px 0 8px}
.map-obj{position:relative;max-width:560px;margin:0 auto;display:grid;gap:6px;padding:18px 22px;border-radius:14px;color:#fff;background:linear-gradient(135deg,#0a2540,#1a2f6b 60%,color-mix(in srgb,var(--c) 55%,#3b2f8f));box-shadow:0 20px 40px -18px rgba(10,37,64,.55)}
.map-obj b{font-size:17px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
.map-obj::after{content:"";position:absolute;left:50%;bottom:-28px;width:2px;height:28px;background:var(--line-2)}
.map-cols{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:20px;margin-top:56px}
.map-cols::before{content:"";position:absolute;top:-28px;height:2px;background:var(--line-2);left:calc(100% / var(--n) / 2 - 10px);right:calc(100% / var(--n) / 2 - 10px)}
.map-col{position:relative;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.map-col::before{content:"";position:absolute;left:50%;top:-28px;height:28px;width:2px;background:var(--line-2)}
.map-col::after{content:"";position:absolute;left:50%;top:40px;bottom:16px;width:2px;background:var(--line);z-index:-1}
.map-kr{display:grid;gap:8px;text-align:left;padding:16px 18px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--line),0 10px 24px -12px rgba(16,24,40,.18);transition:transform .15s,box-shadow .15s}
.map-kr:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--line-2),0 16px 30px -12px rgba(16,24,40,.22)}
.map-kr b{font-size:14.5px;line-height:1.35;font-weight:600}
.map-kr.st-b-blocked{box-shadow:0 0 0 1.5px var(--bad),0 10px 24px -12px rgba(16,24,40,.18)}
.map-kr.st-b-risk{box-shadow:0 0 0 1.5px var(--warn-mid),0 10px 24px -12px rgba(16,24,40,.18)}
.evbar{display:flex;gap:3px}
.evbar i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.map-init{align-self:center;max-width:100%;padding:7px 14px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:12.5px;font-weight:500;color:var(--ink-2);text-align:left}
.map-init:hover{box-shadow:0 0 0 1px var(--accent-line);color:var(--ink)}
.map-act{display:flex;gap:8px;align-items:flex-start;text-align:left;padding:9px 12px;border-radius:8px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:12.5px;color:var(--ink-2);line-height:1.4}
.map-act:hover{box-shadow:0 0 0 1px var(--line-2)}
.map-act span:not(.mck){flex:1}
.map-act em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.map-act.nx{box-shadow:0 0 0 1.5px var(--accent)}.map-act.nx em{color:var(--accent-ink)}
.map-act.wait{background:var(--warn-soft);box-shadow:0 0 0 1px color-mix(in srgb,var(--warn-mid) 50%,transparent)}.map-act.wait em{color:var(--warn)}
.mck{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;margin-top:2px;background:var(--surface)}
.map-more{align-self:center;font-size:12.5px;color:var(--ink-3);padding:4px 10px;border-radius:12px;background:var(--bg)}
.map-more:hover{color:var(--accent-ink)}

.tl-wrap{overflow-x:auto;margin-top:16px;border-radius:14px;box-shadow:0 0 0 1px var(--line),0 8px 20px -12px rgba(16,24,40,.12);background:var(--surface)}
.tl{--lab:280px;position:relative;min-width:960px;padding:0 18px 0 20px}
.tl-lane{display:grid;grid-template-columns:var(--lab) minmax(0,1fr);border-top:1px solid var(--line);min-height:96px}
.tl-head{border-top:0;min-height:0}
.tl-lab{padding:16px 16px 16px 0;display:grid;gap:6px;align-content:start}
.tl-lab b{font-size:14px;line-height:1.35;font-weight:600}
.tl-lab .dep{justify-self:start}
.tl-months,.tl-weeks{display:grid}
.tl-months span{font-size:12px;font-weight:600;color:var(--ink-2);padding:10px 0 2px 6px;border-left:1px solid var(--line);text-transform:capitalize}
.tl-weeks span{font-size:11px;font-weight:600;color:var(--ink-4);text-align:center;padding:2px 0 8px}
.tl-weeks span.cur{color:var(--accent-ink)}
.tl-track{position:relative;min-height:96px}
.tl-bar{position:absolute;top:50%;transform:translateY(-50%);height:30px;border-radius:7px;padding:0 10px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-line)}
.tl-bar.st-bar-on,.tl-bar.st-bar-done{background:var(--accent);color:#fff;box-shadow:none}
.tl-bar.st-bar-risk{background:repeating-linear-gradient(135deg,var(--warn-soft) 0 8px,color-mix(in srgb,var(--warn-mid) 22%,var(--warn-soft)) 8px 16px);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-mid)}
.tl-bar.st-bar-blocked{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.tl-bar.done{opacity:.55}.tl-bar.paused{opacity:.45}
.tl-bar:hover{filter:brightness(.97)}
.tl-ms{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:18px;line-height:1;color:var(--ink)}
.tl-empty{position:absolute;inset:auto 12px;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--ink-4);text-align:left}
.tl-empty:hover{color:var(--accent-ink)}
.tl-ci{min-height:46px}
.tl-cis{display:grid;align-items:center}
.tl-cis span{display:grid;place-items:center}
.tl-cis i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.tl-today{position:absolute;top:44px;bottom:0;width:2px;background:var(--accent);pointer-events:none}
.tl-today span{position:absolute;top:-2px;left:6px;font-size:10.5px;font-weight:700;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.06em;background:var(--surface);padding:0 3px}

.ev-edit{display:grid;gap:6px}
.deps-pick{display:grid;gap:4px;max-height:220px;overflow:auto;padding:4px;border-radius:var(--r-s);box-shadow:inset 0 0 0 1px var(--line)}
.dep-opt{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:6px;font-size:13px;color:var(--ink-2);cursor:pointer}
.dep-opt:hover{background:var(--sunken)}
.dep-opt input{margin-top:3px;accent-color:var(--accent)}
.dep-opt b{font-weight:600;color:var(--ink)}

/* check-in */
.ci-form{display:grid;gap:18px}
.ci-obj{border-radius:14px;box-shadow:0 0 0 1px var(--line),0 4px 14px -8px rgba(16,24,40,.1);background:var(--surface);overflow:hidden}
.ci-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ci-head i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.ci-head h2{font-size:15px}
.ci-head .small{flex:1}
.ci-kr{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.ci-krt{display:grid;gap:2px;min-width:0}
.ci-krt b{font-weight:500;font-size:14px;line-height:1.35}
.ci-krt .small{display:flex;gap:6px;align-items:center}
.ciseg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.ciseg label{position:relative;cursor:pointer}
.ciseg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ciseg span{display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.ciseg label:hover span{color:var(--ink)}
.ciseg input:focus-visible + span{outline:2px solid var(--accent);outline-offset:1px}
.ciseg input:checked + span{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.ciseg .on input:checked + span{color:var(--ok)}.ciseg .risk input:checked + span{color:var(--warn)}.ciseg .blocked input:checked + span{color:var(--bad)}
.ci-note{padding:12px 18px 16px}
.ci-note .textarea{min-height:56px}
.ci-reflect{border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:14px 18px;background:var(--surface)}
.ci-reflect summary{cursor:pointer;display:flex;gap:8px;align-items:baseline}
.ci-submit{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:6px 0;flex-wrap:wrap}
.ci-submit .small{max-width:52ch}
.ci-dots{display:inline-flex;align-items:center;gap:2px;margin-left:10px}
.ci-dots i{width:8px;height:8px;border-radius:50%}
.ci-dots i.od{width:6px;height:6px;margin-right:3px}

@media (max-width:1100px){.bk{grid-template-columns:72px minmax(0,1fr)}.bk-side{grid-column:2}}
@media (max-width:860px){
  .ohero-in{padding:calc(14px) 16px 20px}
  .ohero-eyebrow{margin-top:22px}
  .ohero-h1{font-size:26px}
  .otiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:20px}
  .otile{padding:12px}
  .otile-v b{font-size:22px}
  .otile.next{grid-column:1/-1}
  .qfoot .qms{display:none}
  .view-bar{margin-bottom:0}
  .viewseg{display:flex;width:100%}.viewseg button{flex:1;justify-content:center}
  .bk{grid-template-columns:1fr;gap:12px;padding:26px 0}
  .bk-num{flex-direction:row;align-items:center}
  .bk-num > span{font-size:34px}
  .spine{width:auto;flex:1;height:4px;margin:0}
  .spine b{right:auto;bottom:0;height:100%!important;width:var(--w,0)}
  .bk-side{grid-column:1}
  .bk-title{font-size:19px}
  .evs{grid-template-columns:1fr}
  .ev{min-height:44px;align-items:center}
  .map-cols{grid-template-columns:1fr;gap:28px;margin-top:40px}
  .map-cols::before{display:none}
  .map-col::before{top:-28px}
  .ci-kr{grid-template-columns:1fr;gap:8px}
  .ci-kr .kr-no{display:none}
  .ciseg{display:flex}.ciseg label{flex:1}.ciseg span{justify-content:center;width:100%;height:36px;padding:0 4px;font-size:12px}
  .ci-submit .btn{width:100%}
}
.sheet>form{display:flex;flex-direction:column;min-height:0;flex:1 1 auto}.sheet-body{flex:1 1 auto;min-height:0}
.tl-ms{top:16px;transform:translateX(-50%);font-size:15px}
.tl-today span{top:auto;bottom:6px;left:6px}
.ohero-row{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:end;margin-top:28px}
.ohero-row .qstrip{margin:0;padding:0;border:0;order:1}
.onext{order:2;display:grid;gap:4px;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.96);color:#0a2540;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.onext .otile-k{color:var(--accent-ink)}
.onext .next-t{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.onext .link{display:inline-flex;align-items:center;gap:4px;color:var(--accent-ink);justify-self:start}
.onext .link svg{width:13px;height:13px}
@media (max-width:860px){.ohero-row{grid-template-columns:1fr;gap:16px;margin-top:20px}.onext{order:0}}
/* plan je dag */
.sheet-body.plan{gap:22px}
.plan-today{padding:14px;border-radius:12px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--line)}
.plan-th{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.plan-th .num{font-size:13px;font-weight:600;color:var(--ink-2)}
.pslots{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pslot{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 8px 8px 12px;border-radius:9px;border:1px dashed var(--line-2);color:var(--ink-4);font-size:13.5px}
.pslot.on{border:0;background:var(--surface);box-shadow:0 0 0 1px var(--line),var(--shadow-1);color:var(--ink);animation:rise .18s var(--ease)}
.pslot.on.first{box-shadow:0 0 0 1.5px var(--accent),0 4px 12px -6px rgba(38,74,107,.35)}
.pnum{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:650;font-variant-numeric:tabular-nums;color:var(--ink-4);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.pslot.on .pnum{background:var(--ink);color:var(--bg);box-shadow:none}
.pslot.on.first .pnum{background:var(--accent);color:#fff}
.pmain{flex:1;min-width:0;display:grid;gap:2px;text-align:left}
.pt{font-size:14px;font-weight:500;line-height:1.35;color:var(--ink)}
.pm{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdot{width:7px;height:7px;border-radius:50%;flex:none}
.ptag{flex:none;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--sunken);color:var(--ink-3);white-space:nowrap}
.ptag.acc{background:var(--accent-soft);color:var(--accent-ink)}
.ptag.warn{background:var(--warn-soft);color:var(--warn)}
.ptag.bad{background:var(--bad-soft);color:var(--bad)}
.pgroup{display:grid;gap:8px}
.pg-head{display:flex;align-items:center;gap:10px;padding:0 2px}
.pg-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.pg-ic svg.i{width:15px;height:15px}
.pg-t{flex:1;display:grid;line-height:1.3}
.pg-t b{font-size:14px;font-weight:600}
.pg-t span{font-size:12px;color:var(--ink-3)}
.pg-n{font-size:12px;font-weight:600;color:var(--ink-4)}
.prows{display:grid;border-radius:10px;box-shadow:0 0 0 1px var(--line);overflow:hidden;background:var(--surface)}
.prow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-top:1px solid var(--line);transition:background .12s}
.prow:first-child{border-top:0}
.prow:hover{background:var(--sunken)}
.pck{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--line-2);transition:all .12s}
.pck svg.i{width:13px;height:13px;stroke-width:2.2}
.prow:hover .pck{background:var(--accent);color:#fff;box-shadow:none}
.pgroup.quiet .pg-ic{background:var(--sunken);color:var(--ink-3)}
.pgroup.quiet .pt{color:var(--ink-2);font-weight:450}
@media (max-width:860px){.prow,.pslot{min-height:56px}.ptag{display:none}.pslot.on.first .ptag{display:inline}}
@media (max-width:860px){.pslot.on.first .ptag{display:none}.sheet-foot .small{display:none}.plan-today{padding:10px}}
.map{padding-top:20px}
.map-obj{display:flex;align-items:center;gap:10px;width:max-content;max-width:100%;margin:0 auto;padding:9px 16px;border-radius:999px;background:#0a2540;color:#c7d2ee;font-size:13px;box-shadow:0 10px 24px -12px rgba(10,37,64,.5)}
.map-obj b{font-size:13.5px;font-weight:600;color:#fff;letter-spacing:0}
.mo-dot{width:8px;height:8px;border-radius:50%;background:var(--c)}

.map-obj::after{bottom:-28px;left:50%}
@media (max-width:860px){.map-obj{flex-wrap:wrap;justify-content:center;border-radius:14px}}
@media (max-width:860px){.measure .seg button{font-size:11px;padding:0 2px;white-space:normal;line-height:1.15;text-align:center}.ciseg span{font-size:11px;white-space:normal;line-height:1.15;text-align:center}}
.rhythm .rh-row{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;padding:8px 2px;font-size:12.5px;color:var(--ink-2)}
.rh-dots{display:flex;gap:4px}
.rh-dots i{width:12px;height:12px;border-radius:3px;background:var(--line)}
.rh-dots.wk i{width:14px}
.rh-dots i.on{background:var(--accent)}
.rh-dots i.today{box-shadow:0 0 0 1.5px var(--bg),0 0 0 3px var(--accent-line)}
.rh-n{font-size:12px;color:var(--ink-3)}
.pcue{border:0;border-bottom:1px dashed var(--line-2);background:none;font-size:12.5px;padding:3px 0 2px;margin-top:4px;color:var(--ink-2);outline:none;width:100%}
.pcue:focus{border-bottom-color:var(--accent)}
.pcue::placeholder{color:var(--ink-4)}
.cue{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--accent-ink);background:var(--accent-soft);padding:3px 9px;border-radius:12px;margin:-2px 0 8px}

<script>
(()=>{'use strict';
/* ================= data & storage ================= */
const SEED={"schema": 4, "objectives": [], "tasks": [], "inbox": [], "checkins": [], "reviews": [], "sessions": [], "events": [], "planDays": [], "settings": {}};
const KEY='focus-rws-ingevuld-20261014', PRE_KEY=KEY+':voor-v8';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const iso=(d=new Date())=>d.toLocaleDateString('sv-SE');
const dayDiff=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const clean=s=>String(s??'').trim();
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short'}):'';
const rel=d=>{if(!d)return '';const n=dayDiff(iso(),d);return n===0?'vandaag':n===1?'gisteren':n>1&&n<7?n+' dagen geleden':fmt(d)};
const plural=(n,one,many)=>n+' '+(n===1?one:many);
const quarter=()=>{const d=new Date();return 'Q'+(Math.floor(d.getMonth()/3)+1)+' '+d.getFullYear()};

// Voorgestelde bewijsstukken, letterlijk afgeleid uit de acceptatiecriteria ("Behaald wanneer…") van elk KR. Bewerkbaar.
const EVIDENCE_SEED={
 'inkoop-kr-1':['Gedeelde prioriteitenlijst met ICM en het team van Carlita','Rollen en eigenaarschap afgesproken','Besluitmomenten vastgelegd','Afspraken door betrokkenen bevestigd'],
 'inkoop-kr-2':['Omvang en spreiding van de onderzoeksgroep vastgesteld','Praktijkinzichten uit verschillende rollen en werkprocessen','Per prioritaire usecase behoefte, waarde, capabilities en bewijs vastgelegd','Selectie van usecases afgestemd met ICM'],
 'inkoop-kr-3':['Overlap met tools van de digitaliseringsimpuls in beeld','Waarde, haalbaarheid, beheer en afhankelijkheden per oplossing beoordeeld','Herleidbaar advies: benutten, zelf bouwen, met partners of inkopen','Besluitnemers benoemd'],
 'waarde-kr-1':['Klantreis, intake en overdrachten afgestemd met het team','Verantwoordelijkheden en besluitmomenten belegd','Gedragen procesplaat en intakeafspraken','Werkwijze toegepast op een concrete klantvraag, met feedback'],
 'waarde-kr-2':['Product en scope gekozen','Waardelogica vastgelegd: welke waarde voor wie','Signalen en meetverantwoordelijkheid afgesproken','Review- en bijstuurafspraken vastgelegd'],
 'waarde-kr-3':['RPA-gebruiksindicatoren afgesproken','Indicatoren herleidbaar uit de bron beschikbaar','Beperkingen en interpretatie vastgelegd','Eerste bespreking gebruikt om keuzes te maken'],
 'rpa-kr-1':['Licentiemogelijkheden en grenzen onderzocht','Eerste doelgroep geselecteerd','Afgebakende usecases op waarde, geschiktheid en haalbaarheid beoordeeld','Vastgelegd wat wel en niet decentraal kan'],
 'rpa-kr-2':['Rollen en ontwikkelgrenzen afgesproken','Kwaliteitscontrole en beheer geregeld','Ondersteuning belegd','RPA-team acht de ondersteuning uitvoerbaar binnen capaciteit'],
 'rpa-kr-3':['Doelgroep en uitnodiging uitgewerkt','Leerroute en ondersteuning uitgewerkt','Evaluatiecriteria en go/no-go-moment bepaald','Bekend wie het startbesluit neemt'],
 'onboarding-kr-1':['Samenhang assetmanagement en ondersteunende processen kunnen uitleggen','Beeld getoetst door relevante collega’s','Beknopt gevalideerd overzicht','Toegepast op een concrete vraag uit eigen werk'],
 'onboarding-kr-2':['Per opdracht eigenaar, beslisser, partner en aanspreekpunt bekend','Open vragen uit resterende kennismakingen beantwoord','Getoetste stakeholderkaart','Rol- en samenwerkingsafspraken'],
 'onboarding-kr-3':['Technisch landschap in eigen woorden uitgelegd','Mogelijkheden en beperkingen benoemd','Overzicht gevalideerd met technische collega’s','Technische afwegingen bij een actuele casus besproken'],
};
let db, storageOk=true;
function load(){
  let raw=null;try{raw=localStorage.getItem(KEY)}catch{storageOk=false}
  let data=null;if(raw){try{data=JSON.parse(raw)}catch{data=null}}
  if(data&&(data.schema||0)<4){try{if(!localStorage.getItem(PRE_KEY))localStorage.setItem(PRE_KEY,raw)}catch{}}
  db=data||JSON.parse(JSON.stringify(SEED));normalize();applyContentUpdates();
}
function normalize(){
  db.objectives=(db.objectives||[]).map(o=>({color:'#264A6B',...o,color:COLOR_MAP[String(o.color||'').toLowerCase()]||o.color||'#264A6B',archived:!!o.archived,
    krs:(o.krs||[]).map(k=>{const n={unit:'mijlpaal',target:1,current:null,description:'',due:'',kind:'outcome',...k,confidence:k.confidence||'unknown',dependsOn:Array.isArray(k.dependsOn)?k.dependsOn:[]};
      if(!Array.isArray(n.evidence)){n.evidence=(EVIDENCE_SEED[k.id]||[]).map(t=>({id:uid(),title:t,done:false,doneAt:null}));n.evidenceSeeded=!!EVIDENCE_SEED[k.id]}
      return n}),
    initiatives:(o.initiatives||[]).map(i=>({description:'',krId:'',start:'',end:'',...i,status:i.status||'active'}))}));
  db.checkins=db.checkins||[];db.planDays=Array.isArray(db.planDays)?db.planDays:[];db.settings={objView:'briefing',checkinDay:5,checkinTime:'16:00',week:JSON.parse(JSON.stringify(WEEK_DEFAULT)),...(db.settings||{})};
  db.inbox=db.inbox||[];
  db.tasks=(db.tasks||[]).map(t=>({objectiveId:'',krId:'',notes:'',due:'',cue:'',created:iso(),...t,done:!!t.done,focus:!!t.focus&&!t.done,waiting:!!t.waiting,blocker:t.blocker||'',today:t.today||'',rank:t.rank||0,doneAt:t.done?(t.doneAt||null):null,steps:Array.isArray(t.steps)?t.steps:[]}));
  // Inbox-items worden gewone, nog ongekoppelde taken. Het origineel blijft bewaard (status 'actie').
  for(const i of db.inbox)if(i.status==='inbox'){db.tasks.push({id:uid(),title:i.title,notes:i.notes||'',objectiveId:'',krId:'',due:'',done:false,focus:false,waiting:false,blocker:'',today:'',rank:0,doneAt:null,steps:[],created:i.created||iso(),fromInbox:i.id});i.status='actie'}
  db.reviews=db.reviews||[];db.events=db.events||[];db.sessions=db.sessions||[];db.activeSession=db.activeSession||null;db.schema=4;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));storageOk=true;setSaved();markDirty()}
  catch{storageOk=false;setSaved();toast('Opslaan lukt niet in deze browser. Exporteer een back-up via Gegevens.')}
}
function setSaved(){const el=$('#saveState');if(!el)return;el.classList.toggle('err',!storageOk);el.textContent=storageOk?'Opgeslagen · '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}):'Niet opgeslagen'}
const ACTIVE=new Set(['done','session','measure','step','evidence']);
function log(type,title,objectiveId=''){db.events.unshift({id:uid(),date:iso(),ts:Date.now(),type,title,objectiveId});db.events=db.events.slice(0,600)}
function commit(fn,{msg,undo=false}={}){
  const snap=JSON.stringify(db);fn();save();render();refreshOpenSheet();
  if(msg)toast(msg,undo?()=>{db=JSON.parse(snap);save();render();refreshOpenSheet()}:null);
}

/* ================= derived ================= */
const objs=()=>db.objectives.filter(o=>!o.archived);
const obj=id=>db.objectives.find(o=>o.id===id);
const task=id=>db.tasks.find(t=>t.id===id);
const krById=id=>{for(const o of db.objectives){const k=o.krs.find(k=>k.id===id);if(k)return{o,k,i:o.krs.indexOf(k)+1}}return null};
const krOf=t=>{const r=t.krId?krById(t.krId):null;return r&&r.o.id===t.objectiveId?r:null};
const open=()=>db.tasks.filter(t=>!t.done);
const inboxTasks=()=>open().filter(t=>!t.objectiveId);
const isToday=t=>t.today===iso();
const achieved=k=>k.current!=null&&Number(k.current)>=Number(k.target);
const krState=k=>achieved(k)?'done':k.confidence;
const STATE={done:'Behaald',on:'Op koers',risk:'Aandacht nodig',blocked:'Geblokkeerd',unknown:'Niet beoordeeld'};
const isMilestone=k=>Number(k.target)===1;
function activity(oid,days){const t=iso(),a=Array(days).fill(0);for(const e of db.events){if(e.objectiveId!==oid||!ACTIVE.has(e.type))continue;const n=dayDiff(t,e.date);if(n>=0&&n<days)a[days-1-n]++}return a}
const lastActivity=oid=>db.events.find(e=>e.objectiveId===oid&&ACTIVE.has(e.type))?.date||null;
const momentum=oid=>activity(oid,7).reduce((a,b)=>a+b,0);
function todayList(){return open().filter(isToday).sort((a,b)=>(a.rank||0)-(b.rank||0))}
function carryOver(){const t=iso();return open().filter(x=>x.today&&x.today<t)}
function nextAction(){
  const td=todayList().filter(t=>!t.waiting);if(td[0])return{t:td[0],why:'eerste op je lijst voor vandaag'};
  const wf=open().filter(t=>t.focus&&!t.waiting);if(wf[0])return{t:wf[0],why:'een weekprioriteit'};
  return null;
}
function criterion(k){const d=(k.description||'').split('\n')[0];return d.replace(/^Voorgesteld resultaat:\s*/,'').split(/(?<=\.)\s+Bewijs:/)[0]}
function signals(){
  const out=[],t=iso();
  for(const o of objs()){
    o.krs.forEach((k,idx)=>{if(achieved(k))return;const i=idx+1;
      if(k.confidence==='blocked')out.push({w:0,o,text:`KR ${i} is geblokkeerd`,sub:k.title,a:'goto-kr',id:k.id,label:'Bekijk'});
      else if(k.confidence==='risk')out.push({w:1,o,text:`KR ${i} heeft aandacht nodig`,sub:k.title,a:'goto-kr',id:k.id,label:'Bekijk'});
      if(!db.tasks.some(x=>!x.done&&x.krId===k.id))out.push({w:2,o,text:`${o.name} · KR ${i} heeft geen volgende actie`,sub:k.title,a:'capture-kr',id:k.id,label:'Actie toevoegen'});
    });
    const last=lastActivity(o.id),born=db.tasks.filter(x=>x.objectiveId===o.id).map(x=>x.created).sort()[0];
    const ref=last||born;
    if(ref&&dayDiff(t,ref)>=7)out.push({w:1.5,o,text:last?`${o.name}: geen voortgang sinds ${rel(last)}`:`${o.name}: nog geen voortgang vastgelegd`,sub:last?'Geen afgeronde acties, sessies of metingen in 7 dagen.':'Sinds '+fmt(born)+' geen afgeronde actie of meting.',a:'goto-obj',id:o.id,label:'Open'});
  }
  const late=open().filter(x=>x.due&&x.due<t);if(late.length)out.push({w:.5,text:plural(late.length,'actie over de deadline','acties over de deadline'),sub:late.map(x=>x.title).join(' · '),a:'goto-tasks',id:'open',label:'Bekijk'});
  const wait=open().filter(x=>x.waiting);if(wait.length)out.push({w:2.5,text:plural(wait.length,'actie wacht op iets of iemand','acties wachten op iets of iemand'),sub:wait.map(x=>x.blocker||x.title).join(' · '),a:'goto-tasks',id:'wacht',label:'Bekijk'});
  if(checkinDue()&&objs().length){const l=db.checkins[0],late2=!l||dayDiff(iso(),l.date)>=14;out.push({w:late2?1.8:3.5,text:'Wekelijkse check-in staat open',sub:l?'Vorige: '+rel(l.date)+'.':'Nog nooit gedaan. Twee minuten per week.',a:'goto-checkin',label:'Check-in'})}
  const ib=inboxTasks();if(ib.length)out.push({w:3,text:plural(ib.length,'item in je inbox','items in je inbox'),sub:'Koppel, plan of laat los.',a:'goto-tasks',id:'inbox',label:'Ordenen'});
  const un=objs().flatMap(o=>o.krs.map(k=>({o,k}))).filter(x=>!achieved(x.k)&&x.k.confidence==='unknown');
  if(un.length)out.push({w:4,text:plural(un.length,'Key Result nog niet beoordeeld','Key Results nog niet beoordeeld'),sub:'Geef per KR aan of het op koers ligt. Dat is een oordeel, geen percentage.',a:'goto-kr',id:un[0].k.id,label:'Beoordeel'});
  return out.sort((a,b)=>a.w-b.w);
}

function taskRow(t,{showObj=true,flash=false}={}){

  else if(!r&&o)m.push('<span>Nog niet aan een KR gekoppeld</span>');
  if(t.waiting)m.push(`<span class="tag wait">Wacht${t.blocker?': '+esc(t.blocker):''}</span>`);
  if(t.focus)m.push('<span class="tag focus">Weekprioriteit</span>');
  if(t.due&&!t.done)m.push(t.due<iso()?`<span class="tag late">${fmt(t.due)}</span>`:`<span>${fmt(t.due)}</span>`);
  if(t.steps.length)m.push(`<span class="num">${t.steps.filter(s=>s.done).length}/${t.steps.length} stappen</span>`);
  if(t.done&&t.doneAt)m.push(`<span>Afgerond ${rel(t.doneAt)}</span>`);

    <button class="check" data-a="toggle" data-id="${t.id}" aria-pressed="${t.done}" aria-label="${t.done?'Heropen':'Afronden'}: ${esc(t.title)}">${CHECK}</button>
    <button class="task-main" data-a="open-task" data-id="${t.id}"><span class="task-title">${esc(t.title)}</span>${m.length?`<span class="task-meta">${m.join('<i class="sep">·</i>')}</span>`:''}</button>
    ${t.done?'':`<span class="task-tools"><button class="tool ${isToday(t)?'on':''}" data-a="today" data-id="${t.id}" aria-pressed="${isToday(t)}" aria-label="${isToday(t)?'Van vandaag halen':'Op vandaag zetten'}: ${esc(t.title)}" title="${isToday(t)?'Op je lijst voor vandaag':'Op vandaag zetten'}">${I('sun')}</button><button class="tool" data-a="focus" data-id="${t.id}" aria-label="Focus op: ${esc(t.title)}" title="Focussessie starten">${I('play')}</button></span>`}
  </li>`;
}

function krSummary(o){const c={done:0,on:0,risk:0,blocked:0,unknown:0};o.krs.forEach(k=>c[krState(k)]++);
  const parts=[`${c.done}/${o.krs.length} behaald`];if(c.blocked)parts.push(c.blocked+' geblokkeerd');if(c.risk)parts.push(c.risk+' aandacht');if(c.on)parts.push(c.on+' op koers');if(c.unknown)parts.push(c.unknown+' niet beoordeeld');return parts.join(' · ')}

let showDone={};
const STCOL={done:'var(--ok)',on:'var(--ok-mid)',risk:'var(--warn-mid)',blocked:'var(--bad)',unknown:'var(--idle)'};
const pad=n=>String(n).padStart(2,'0');
function quarterWeeks(){
  const d=new Date(),q=Math.floor(d.getMonth()/3),qs=new Date(d.getFullYear(),q*3,1,12),qe=new Date(d.getFullYear(),q*3+3,0,12);
  const w=new Date(qs);w.setDate(w.getDate()-((w.getDay()+6)%7));const weeks=[];
  while(w<=qe){weeks.push(iso(w));w.setDate(w.getDate()+7)}
  return{start:iso(qs),end:iso(qe),weeks};
}
function isoWeek(s){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+3-(d.getDay()+6)%7);const w1=new Date(d.getFullYear(),0,4,12);return 1+Math.round(((d-w1)/864e5-3+(w1.getDay()+6)%7)/7)}
const qpos=(s,Q)=>Math.max(0,Math.min(100,dayDiff(s,Q.weeks[0])/(Q.weeks.length*7)*100));
const evDone=k=>k.evidence.filter(e=>e.done).length;
const krRatio=k=>achieved(k)?1:k.evidence.length?evDone(k)/k.evidence.length:(isMilestone(k)?0:Math.min(1,(Number(k.current)||0)/Number(k.target)));
function krLabel(id,fromObj){const r=krById(id);if(!r)return '';return (r.o.id===fromObj?'':r.o.name+' · ')+'KR '+r.i}
function confHistory(krId,n=4){const h=[];for(const c of db.checkins){const it=c.items.find(x=>x.krId===krId);if(it)h.unshift(it.confidence);if(h.length>=n)break}return h}
const trendDots=k=>{const h=confHistory(k.id);return h.length?`<span class="trend" title="Inschatting bij de laatste ${h.length} check-ins">${h.map(c=>`<i style="background:${STCOL[c]||STCOL.unknown}"></i>`).join('')}</span>`:''};
function objNext(o){
  const ts=open().filter(t=>t.objectiveId===o.id&&!t.waiting);
  return ts.find(isToday)||ts.find(t=>t.focus)||ts.find(t=>{const r=krOf(t);return r&&['blocked','risk'].includes(r.k.confidence)})||ts.find(t=>{const r=krOf(t);return r&&!achieved(r.k)&&r.k.dependsOn.every(id=>{const d=krById(id);return !d||achieved(d.k)})})||ts[0]||null;
}

     <div class="ohero-actions"><button class="hbtn" data-a="edit-obj" data-id="${o.id}" aria-label="Objective bewerken">${I('edit')}</button><button class="hbtn" data-a="ai" data-id="${o.id}">${I('spark')}<span class="hide-m"> AI-briefing</span></button><button class="hbtn solid hide-m" data-a="capture" data-id="${o.id}">${I('plus')} Vastleggen</button></div></div>
   <div class="ohero-eyebrow">Objective ${pad(idx)} · ${esc(o.name)} · ${quarter()}</div>

     <div class="ev-head"><span class="lbl-s">Bewijs <span class="num">${evDone(k)}/${k.evidence.length}</span></span>${k.evidence.length&&evDone(k)*2>=k.evidence.length&&evDone(k)<k.evidence.length?`<span class="ev-togo">nog ${k.evidence.length-evDone(k)} te gaan</span>`:''}${k.evidenceSeeded?'<span class="small">Voorstel uit je criteria · aanpassen via ⋯</span>':''}</div>
     <div class="evs">${k.evidence.map(e=>`<button class="ev ${e.done?'on':''}" data-a="ev" data-id="${k.id}" data-e="${e.id}" aria-pressed="${e.done}"><span class="evb">${CHECK}</span><span>${esc(e.title)}</span>${e.done&&e.doneAt?`<em>${fmt(e.doneAt)}</em>`:''}</button>`).join('')}

     <div class="measure">

     <form class="add-line" data-form="quick-kr" data-o="${o.id}" data-kr="${k.id}">${I('plus')}<input name="title" placeholder="${op.length?'Actie toevoegen…':'Wat is de eerstvolgende actie?'}" aria-label="Actie toevoegen aan KR ${i}" maxlength="250" autocomplete="off"></form>

function mapView(o,tasks){

  <div class="map-cols" style="--n:${Math.max(1,o.krs.length)}">${o.krs.map((k,idx)=>{const i=idx+1,s=krState(k),inits=o.initiatives.filter(x=>x.krId===k.id),op=tasks.filter(t=>t.krId===k.id&&!t.done);

let nextIds=new Set();
function timelineView(o){
  const Q=quarterWeeks(),W=Q.weeks,n=W.length,t=iso(),tp=qpos(t,Q);
  const months=[];W.forEach((w,i)=>{const m=new Date(w+'T12:00:00').toLocaleDateString('nl-NL',{month:'short'});if(!months.length||months.at(-1).m!==m)months.push({m,i,c:1});else months.at(-1).c++});
  const grid=`background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100% / ${n}) 100%`;
  const lanes=o.krs.map((k,idx)=>{const i=idx+1,s=krState(k),inits=o.initiatives.filter(x=>x.krId===k.id),planned=inits.filter(x=>x.start&&x.end),un=inits.filter(x=>!(x.start&&x.end));
    const firstStart=planned.map(x=>x.start).sort()[0];
    const conflicts=k.dependsOn.map(id=>krById(id)).filter(d=>d&&!achieved(d.k)&&firstStart&&(!d.k.due||d.k.due>firstStart));
    return `<div class="tl-lane"><div class="tl-lab"><div class="row"><span class="lbl-s st-${s}">KR ${i}</span>${stateBadge(k)}</div><b>${esc(k.title)}</b>
      ${k.dependsOn.length?`<span class="dep ${conflicts.length?'bad':''}">↳ na ${k.dependsOn.map(id=>esc(krLabel(id,o.id))).join(', ')}${conflicts.length?' · start overlapt':''}</span>`:''}
      ${un.length?`<span class="small">${un.map(x=>`<button class="link" data-a="edit-init" data-id="${x.id}">◇ plan “${esc(x.title.length>34?x.title.slice(0,33)+'…':x.title)}”</button>`).join('<br>')}</span>`:''}</div>
     <div class="tl-track" style="${grid}">
      ${planned.map(x=>{const l=qpos(x.start,Q),r=qpos(addDays(x.end,1),Q);return `<button class="tl-bar st-bar-${s} ${x.status}" style="left:${l}%;width:${Math.max(2,r-l)}%" data-a="edit-init" data-id="${x.id}" title="${esc(x.title)} · ${fmt(x.start)}–${fmt(x.end)}">◇ ${esc(x.title)}</button>`}).join('')}
      ${k.due&&k.due>=W[0]&&k.due<=Q.end?`<span class="tl-ms st-${s}" style="left:${qpos(k.due,Q)}%" title="KR ${i} gereed: ${fmt(k.due)}">◆</span>`:''}
      ${!planned.length&&!k.due?`<button class="tl-empty" data-a="edit-kr" data-id="${k.id}">Zet een streefdatum of plan een initiatief</button>`:''}
     </div></div>`}).join('');
  const ciRow=W.map((w,i)=>{const end=W[i+1]||addDays(Q.end,1);const c=db.checkins.find(c=>c.date>=w&&c.date<end);if(!c)return `<span></span>`;const st=o.krs.map(k=>c.items.find(x=>x.krId===k.id)?.confidence).filter(Boolean);const worst=['blocked','risk','unknown','on','done'].find(x=>st.includes(x))||'unknown';return `<span><i style="background:${STCOL[worst]}" title="Check-in ${fmt(c.date)}"></i></span>`}).join('');
  return `<div class="tl-wrap"><div class="tl">
    <div class="tl-lane tl-head"><div class="tl-lab small">Key Results</div><div><div class="tl-months" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${months.map(m=>`<span style="grid-column:span ${m.c}">${m.m}</span>`).join('')}</div><div class="tl-weeks" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${W.map(w=>`<span class="${t>=w&&t<addDays(w,7)?'cur':''}">${isoWeek(w)}</span>`).join('')}</div></div></div>
    ${lanes}
    <div class="tl-lane tl-ci"><div class="tl-lab small">Check-ins</div><div class="tl-cis" style="grid-template-columns:repeat(${n},minmax(0,1fr));${grid}">${ciRow}</div></div>
    <div class="tl-today" style="left:calc(var(--lab) + (100% - var(--lab)) * ${tp/100})"><span>vandaag</span></div>
  </div></div>
  <p class="explain" style="margin-top:12px">Balken zijn initiatieven met een start- en einddatum, ◆ is de streefdatum van een KR. Afhankelijkheden zet je in het KR-menu (⋯). Klik op een balk om te plannen.</p>`;
}

let openGroups=new Set();

     ${list.length?`<ul class="tasks">${list.map(x=>taskRow(x,{flash:flashId===x.id})).join('')}</ul>`:`<div class="empty"><b>${tab==='wacht'?'Niets wacht.':'Nog niets afgerond.'}</b></div>`}</div>`;
  }
  const ib=inboxTasks(),wait=open().filter(x=>x.waiting).length,done=db.tasks.filter(x=>x.done).length;

  return `<div class="page narrow"><header class="top"><div><h1>Acties</h1><p class="lede">Ingeklapt per objective. Klap er één open als je erin wilt werken.</p></div><div class="row"><button class="btn ghost" data-a="ai-paste">${I('spark')} AI-voorstel plakken</button></div></header>
   <section class="agrp inbox ${ib.length?'has':''}"><div class="agrp-h static"><span class="agrp-t">Inbox</span><span class="agrp-n num">${ib.length}</span></div>
    <div class="agrp-b">${ib.length?`<ul class="tasks">${ib.map(inboxRow).join('')}</ul>`:'<p class="small" style="margin:4px 0 8px">Leeg. Alles heeft een plek.</p>'}<form class="add-line" data-form="quick-inbox">${I('plus')}<input name="title" placeholder="Leg iets vast, bijvoorbeeld: Camiel bellen over use cases" aria-label="Actie vastleggen" maxlength="250" autocomplete="off"></form></div></section>
   ${objs().map(grp).join('')}
   <div class="afoot"><a class="link quiet" href="#/taken/wacht">Wacht · ${wait}</a><a class="link quiet" href="#/taken/klaar">Afgerond · ${done}</a></div>
  </div>`;
